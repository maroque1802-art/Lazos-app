<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lazos · Prototipo de abonos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c-primary:#0D5E3C;
  --c-primary-600:#0a4a30;
  --c-accent:#F9A82E;
  --c-accent-600:#dd8f18;
  --c-leaf:#358340;
  --bg:#ffffff;
  --bg-alt:#f5f8f6;
  --card:#ffffff;
  --text:#152420;
  --text-muted:#5c6d64;
  --border:#e1e9e4;
  --shadow:0 4px 18px rgba(13,94,60,0.09);
  --radius:16px;
  --radius-sm:10px;
  --focus-ring:0 0 0 3px rgba(249,168,46,0.6);
  --success:#1c8a4c;
  --success-bg:#e6f5ec;
  --danger:#b3261e;
  --danger-bg:#fbeceb;
  --warning:#9a6a00;
  --warning-bg:#fff4e0;
  --info-bg:#eaf2ff;
  --info:#1d4ed8;
}
:root[data-theme="dark"]{
  --bg:#0e1713;
  --bg-alt:#111d17;
  --card:#16241d;
  --text:#eaf3ee;
  --text-muted:#a3b8ac;
  --border:#274035;
  --shadow:0 4px 20px rgba(0,0,0,0.5);
  --c-primary:#3ecb8e;
  --c-primary-600:#2fa876;
  --c-accent:#ffb84d;
  --c-accent-600:#f9a82e;
  --c-leaf:#5cb86a;
  --success:#4fd28a;
  --success-bg:#123322;
  --danger:#ff8a80;
  --danger-bg:#3a1815;
  --warning:#ffcf6b;
  --warning-bg:#3a2c0a;
  --info-bg:#132a44;
  --info:#8ab4ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1713; --bg-alt:#111d17; --card:#16241d; --text:#eaf3ee; --text-muted:#a3b8ac;
    --border:#274035; --shadow:0 4px 20px rgba(0,0,0,0.5);
    --c-primary:#3ecb8e; --c-primary-600:#2fa876; --c-accent:#ffb84d; --c-accent-600:#f9a82e; --c-leaf:#5cb86a;
    --success:#4fd28a; --success-bg:#123322; --danger:#ff8a80; --danger-bg:#3a1815;
    --warning:#ffcf6b; --warning-bg:#3a2c0a; --info-bg:#132a44; --info:#8ab4ff;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Nunito Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:74px;
}
h1,h2,h3,.brand-font{font-family:'Quicksand', system-ui, sans-serif; font-weight:700;}
a{color:var(--c-primary);}
button{font-family:inherit;}
:focus-visible{outline:none; box-shadow:var(--focus-ring); border-radius:6px;}
.container{max-width:980px; margin:0 auto; padding:0 16px;}
/* ---------- header ---------- */
header.topbar{
  position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
}
.topbar-inner{display:flex; align-items:center; gap:12px; padding:10px 16px; flex-wrap:wrap;}
.logo{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.logo svg{width:40px; height:40px; display:block;}
.logo .word{font-size:22px; color:var(--c-primary); letter-spacing:0.3px;}
.tagline{font-size:11px; color:var(--text-muted); margin-top:-2px;}
.spacer{flex:1;}
.role-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
select, input[type=text], input[type=number], input[type=date], textarea{
  font-family:inherit; font-size:15px; padding:9px 11px; border-radius:var(--radius-sm);
  border:1.5px solid var(--border); background:var(--bg); color:var(--text); min-height:42px;
}
textarea{min-height:70px; resize:vertical;}
select{min-width:150px;}
.icon-btn{
  border:1.5px solid var(--border); background:var(--bg); color:var(--text); border-radius:var(--radius-sm);
  width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;
}
.badge-corte{
  background:var(--info-bg); color:var(--info); font-weight:700; font-size:12.5px; padding:6px 10px; border-radius:999px;
  white-space:nowrap;
}
.demo-warning{
  background:var(--warning-bg); color:var(--warning); font-size:12.5px; padding:8px 16px; text-align:center; border-bottom:1px solid var(--border);
}
/* ---------- nav tabs ---------- */
nav.tabs{display:flex; gap:4px; overflow-x:auto; padding:0 8px 8px; scrollbar-width:thin;}
nav.tabs::-webkit-scrollbar{height:4px;}
.tab-btn{
  border:none; background:transparent; color:var(--text-muted); padding:9px 14px; border-radius:999px;
  font-weight:700; font-size:14px; white-space:nowrap; cursor:pointer;
}
.tab-btn.active{background:var(--c-primary); color:#fff;}
/* ---------- layout ---------- */
main{padding:16px 0 40px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
.card h2{margin:0 0 4px; font-size:19px;}
.card h3{margin:0 0 10px; font-size:16px;}
.muted{color:var(--text-muted); font-size:13.5px;}
.grid{display:grid; gap:12px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:720px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}
.stat{background:var(--bg-alt); border-radius:var(--radius-sm); padding:12px 14px; border:1px solid var(--border);}
.stat .num{font-size:22px; font-weight:800; font-family:'Quicksand',sans-serif;}
.stat.money-out .num{color:var(--danger);}
.stat.money-in .num{color:var(--success);}
.stat.accent .num{color:var(--c-accent-600);}
.stat .lbl{font-size:12.5px; color:var(--text-muted); font-weight:600;}
/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border-radius:999px; border:none; padding:12px 20px; font-weight:800; font-size:15px; cursor:pointer;
  min-height:46px; line-height:1.1;
}
.btn-primary{background:var(--c-primary); color:#fff;}
.btn-primary:hover{background:var(--c-primary-600);}
.btn-accent{background:var(--c-accent); color:#301f00;}
.btn-accent:hover{background:var(--c-accent-600);}
.btn-outline{background:transparent; border:2px solid var(--c-primary); color:var(--c-primary);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border:1.5px solid var(--danger);}
.btn-ghost{background:var(--bg-alt); color:var(--text); border:1.5px solid var(--border);}
.btn-sm{padding:8px 14px; font-size:13.5px; min-height:36px;}
.btn-block{width:100%;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}
/* pills / estado */
.pill{display:inline-block; padding:4px 11px; border-radius:999px; font-size:12.5px; font-weight:800;}
.pill-vigente{background:var(--info-bg); color:var(--info);}
.pill-vencido{background:var(--danger-bg); color:var(--danger);}
.pill-cancelado{background:var(--success-bg); color:var(--success);}
.pill-pendiente{background:var(--warning-bg); color:var(--warning);}
.pill-rechazado{background:var(--danger-bg); color:var(--danger);}
.pill-reversado{background:var(--bg-alt); color:var(--text-muted); border:1px solid var(--border);}
/* lists */
.loan-row{
  display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid var(--border);
  cursor:pointer;
}
.loan-row:last-child{border-bottom:none;}
.loan-row:hover{background:var(--bg-alt);}
.loan-main{min-width:0;}
.loan-main .name{font-weight:800; font-size:15.5px;}
.loan-main .sub{font-size:12.5px; color:var(--text-muted);}
.loan-amt{text-align:right; flex-shrink:0;}
.loan-amt .saldo{font-weight:800; font-size:15.5px;}
.filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.chip{border:1.5px solid var(--border); background:var(--bg); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:700; cursor:pointer; color:var(--text-muted);}
.chip.active{background:var(--c-primary); border-color:var(--c-primary); color:#fff;}
/* tables */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-sm);}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:760px;}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap;}
th{background:var(--bg-alt); position:sticky; top:0; font-size:12px; text-transform:uppercase; letter-spacing:0.3px; color:var(--text-muted);}
tr:hover td{background:var(--bg-alt);}
/* forms */
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-weight:700; font-size:13.5px;}
.field .hint{font-size:12px; color:var(--text-muted);}
.radio-group{display:flex; gap:8px; flex-wrap:wrap;}
.radio-opt{border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; cursor:pointer; font-weight:700; font-size:14px; flex:1; min-width:110px; text-align:center;}
.radio-opt input{display:none;}
.radio-opt.checked{border-color:var(--c-primary); background:var(--success-bg); color:var(--c-primary);}
/* autocomplete */
.autocomplete-wrap{position:relative;}
.autocomplete-list{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:15;
  background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius-sm);
  box-shadow:var(--shadow); max-height:280px; overflow-y:auto;
}
.autocomplete-item{padding:10px 13px; cursor:pointer; border-bottom:1px solid var(--border);}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover, .autocomplete-item:active{background:var(--bg-alt);}
.autocomplete-item .ac-name{font-weight:800; font-size:14.5px;}
.autocomplete-item .ac-meta{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.autocomplete-empty{padding:12px 13px; color:var(--text-muted); font-size:13.5px;}
/* comprobante */
.comprobante-thumb{max-width:220px; max-height:220px; border-radius:10px; border:1px solid var(--border); display:block; cursor:pointer;}
.comprobante-thumb-sm{max-width:130px; max-height:130px; border-radius:8px; border:1px solid var(--border); display:block; margin-top:6px; cursor:pointer;}
.comprobante-preview-wrap{margin-top:8px; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.lightbox-img{max-width:100%; max-height:80vh; border-radius:10px; display:block; margin:0 auto;}
/* modal */
.overlay{position:fixed; inset:0; background:rgba(10,20,15,0.55); z-index:100; display:flex; align-items:flex-end; justify-content:center; padding:0;}
@media(min-width:700px){.overlay{align-items:center; padding:20px;}}
.modal{background:var(--card); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:20px; max-height:92vh; overflow-y:auto; box-shadow:var(--shadow);}
@media(min-width:700px){.modal{border-radius:20px;}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.close-x{background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-muted); padding:4px 8px;}
/* recibo */
.desglose-box{border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin:12px 0; background:var(--card);}
.desglose-box summary{cursor:pointer; font-weight:700; font-size:13.5px; color:var(--c-primary);}
.desglose-tabla{width:100%; border-collapse:collapse;}
.desglose-tabla th, .desglose-tabla td{padding:5px 6px; font-size:13px; border-bottom:1px solid var(--border); text-align:right;}
.desglose-tabla th:first-child, .desglose-tabla td:first-child{text-align:left;}
.desglose-tabla thead th{font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);}
.desglose-tabla tfoot th{font-size:14px; border-bottom:none; border-top:2px solid var(--c-primary); padding-top:8px;}
.desglose-tabla input{width:72px; padding:5px 6px; text-align:right; font-size:13px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text);}
.recibo{border:2px dashed var(--c-primary); border-radius:14px; padding:18px; background:var(--bg-alt);}
.recibo .r-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.recibo table{min-width:0;}
.recibo td{border:none; padding:5px 0; font-size:14px;}
.recibo td.k{color:var(--text-muted); width:55%;}
.recibo td.v{font-weight:800; text-align:right;}
.recibo .legal{font-size:11px; color:var(--text-muted); margin-top:12px; text-align:center;}
/* toast */
#toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--c-primary); color:#fff; padding:12px 20px; border-radius:999px; font-weight:700; font-size:14px; z-index:200; box-shadow:var(--shadow); max-width:90vw; text-align:center;}
/* bottom nav mobile for socio */
.bottom-nav{display:none;}
@media (max-width:720px){
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border);
    z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav button{flex:1; background:none; border:none; color:var(--text-muted); font-size:11.5px; font-weight:700; padding:6px 2px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .bottom-nav button.active{color:var(--c-primary);}
  .bottom-nav .ic{font-size:19px;}
  nav.tabs.desktop-only{display:none;}
  body{padding-bottom:70px;}
}
@media (min-width:721px){.bottom-nav{display:none !important;}}
.empty{text-align:center; padding:34px 10px; color:var(--text-muted);}
.divider{height:1px; background:var(--border); margin:14px 0;}
.kv{display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px dashed var(--border);}
.kv .k{color:var(--text-muted);}
.kv .v{font-weight:700;}
.notice{background:var(--info-bg); color:var(--info); border-radius:var(--radius-sm); padding:10px 13px; font-size:13.5px; margin-bottom:12px;}
.notice.warn{background:var(--warning-bg); color:var(--warning);}
.mov-item{border-left:3px solid var(--border); padding:8px 12px; margin-bottom:8px; border-radius:0 8px 8px 0; background:var(--bg-alt);}
.mov-item.aprobado{border-left-color:var(--success);}
.mov-item.pendiente{border-left-color:var(--warning);}
.mov-item.rechazado{border-left-color:var(--danger);}
.mov-item.reversa{border-left-color:var(--text-muted);}
.mov-top{display:flex; justify-content:space-between; font-weight:800; font-size:14.5px;}
.mov-meta{font-size:12px; color:var(--text-muted); margin-top:3px;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute; top:0; left:0; width:100%; padding:20px;}
  .no-print{display:none !important;}
}
</style>
</head>

/* =========================================================
   UTILIDADES DE FECHA Y DINERO
   ========================================================= */
function parseDMY(str){
  if(!str) return null;
  const [d,m,y] = str.split('/').map(Number);
  return new Date(y, m-1, d);
}
function formatDMY(date){
  const d = String(date.getDate()).padStart(2,'0');
  const m = String(date.getMonth()+1).padStart(2,'0');
  const y = date.getFullYear();
  return `${d}/${m}/${y}`;
}
function formatMoney(n){
  n = Math.round(n);
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-US');
  return (neg?'-':'') + '₡' + s;
}
function moneyInputValue(n){
  return (n || n === 0) ? formatMoney(n) : '';
}
function parseMoneyInputValue(raw){
  const digits = (raw || '').toString().replace(/[^\d]/g,'');
  return digits ? Number(digits) : 0;
}
function formatMoneyInputLive(el){
  const digits = el.value.replace(/[^\d]/g,'');
  el.value = digits ? formatMoney(Number(digits)) : '';
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function addMonthsSameDay(date, n){
  const day = date.getDate();
  const first = new Date(date.getFullYear(), date.getMonth()+n, 1);
  const daysInTarget = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(day, daysInTarget));
}
function roundToMultiple(n, m){ if(!m) return n; return Math.round(n/m)*m; }
function todayCutoff(){ return parseDMY(SEED.fechaCorte); }
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }
function leerComprobanteComoDataURL(file, callback){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* Se recarga todo despues de cada cambio. Con esta cantidad de datos el
   costo es minimo, y evita que la pantalla muestre algo distinto de lo
   que quedo guardado. */
async function cargarTodo(){
  const [socios, prestamos, abonos, movs, recibos, cierres, sols, cfg] = await Promise.all([
    sb.from('socios').select('id, nombre, capital_inicial').order('nombre'),
    sb.from('prestamos').select('*'),
    sb.from('abonos').select('*'),
    sb.from('movimientos').select('*').order('id'),
    sb.from('recibos').select('*').order('numero'),
    sb.from('cierres').select('*').order('numero'),
    sb.from('solicitudes').select('*').order('orden'),
    sb.from('config').select('*').maybeSingle()
  ]);

  const error = [socios, prestamos, abonos, movs, recibos, cierres, sols, cfg]
    .map(r => r.error).find(Boolean);
  if(error) throw error;

  const nombrePorSocioId = {};
  SEED.socios.length = 0;
  (socios.data || []).forEach(r => {
    nombrePorSocioId[r.id] = r.nombre;
    SEED.socios.push({ id: r.id, nombre: r.nombre, capital: Number(r.capital_inicial) });
  });

  SEED.prestamos.length = 0;
  const prestamosPorNumero = {};
  (prestamos.data || []).forEach(r => {
    const p = filaAPrestamo(r, nombrePorSocioId);
    prestamosPorNumero[p.id] = p;
    SEED.prestamos.push(p);
  });

  MOVS.length = 0;
  (abonos.data || []).forEach(r => MOVS.push(filaAbonoHistorico(r, prestamosPorNumero)));
  (movs.data  || []).forEach(r => MOVS.push(filaAMovimiento(r)));

  RECIBOS.length = 0;
  (recibos.data || []).forEach(r => RECIBOS.push(filaARecibo(r)));

  CIERRES.length = 0;
  (cierres.data || []).forEach(r => CIERRES.push(filaACierre(r)));

  SOLICITUDES.length = 0;
  (sols.data || []).forEach(r => SOLICITUDES.push(filaASolicitud(r, nombrePorSocioId)));

  if(cfg.data){
    CONFIG.tasaMensual = Number(cfg.data.tasa_mensual);
    CONFIG.minimoCobrado = Number(cfg.data.minimo_cobrado);
    CONFIG.redondeoActivo = !!cfg.data.redondeo_activo;
    CONFIG.redondeoMultiplo = Number(cfg.data.redondeo_multiplo);
    CONFIG.umbralDias = Number(cfg.data.umbral_dias);
    CONFIG.socioAdmin = cfg.data.socio_admin || 'Ninguno';
    CONFIG.saldoInicialEfectivo = Number(cfg.data.saldo_inicial_efectivo || 0);
  }

  // La fecha de corte es hoy: los vencimientos se comparan contra el dia real.
  const hoy = new Date();
  SEED.fechaCorte = `${String(hoy.getDate()).padStart(2,'0')}/${String(hoy.getMonth()+1).padStart(2,'0')}/${hoy.getFullYear()}`;
  if(!SEED.fechaInicial) SEED.fechaInicial = SEED.fechaCorte;
}

function socioIdPorNombre(nombre){
  const s = SEED.socios.find(x => x.nombre === nombre);
  return s ? s.id : null;
}

/* Envuelve una operacion: muestra el error si falla y recarga si sale bien. */
async function conGuardado(fn, mensajeOk){
  try{
    await fn();
    await cargarTodo();
    if(mensajeOk) toast(mensajeOk);
  }catch(e){
    toast(mensajeDeErrorSb(e));
  }
  render();
}

function mensajeDeErrorSb(e){
  const m = (e && e.message ? e.message : String(e)).toLowerCase();
  if(m.includes('row-level security') || m.includes('permission denied'))
    return 'Tu cuenta no tiene permiso para hacer eso.';
  if(m.includes('failed to fetch') || m.includes('networkerror'))
    return 'Sin conexión. Revisá tu internet e intentá de nuevo.';
  if(m.includes('duplicate key'))
    return 'Ese registro ya existe.';
  return (e && e.message) ? e.message : 'Ocurrió un error.';
}

/* =========================================================
   LOGICA DE NEGOCIO
   ========================================================= */
function prestamoById(id){ return SEED.prestamos.find(p => p.id === id); }
function movimientos(prestamoId){ return MOVS.filter(m => m.prestamoId === prestamoId); }
function esAprobado(m){ return m.estado === 'aprobado' || m.estado === 'aprobado_caja'; }
function movimientosAprobados(prestamoId){ return movimientos(prestamoId).filter(esAprobado); }
function movimientosPendientes(prestamoId){ return movimientos(prestamoId).filter(m => m.estado==='pendiente' || m.estado==='reportado_pendiente_caja'); }

function totalAPagar(p){ return p.monto + p.intereses; }
function totalAbonadoConfirmado(id){ return movimientosAprobados(id).reduce((s,m)=>s+m.monto,0); }
function totalRebajasConfirmadas(id){ return movimientosAprobados(id).reduce((s,m)=>s+(m.rebajaAplicada||0),0); }
function totalAbonadoPendiente(id){ return movimientosPendientes(id).reduce((s,m)=>s+m.monto,0); }
function saldoConfirmado(p){
  const s = totalAPagar(p) - totalAbonadoConfirmado(p.id) - totalRebajasConfirmadas(p.id);
  return Math.max(0, Math.round(s));
}
function calcEstado(p){
  const saldo = saldoConfirmado(p);
  if(saldo <= 0) return 'Cancelado';
  const venc = parseDMY(p.vencimiento);
  if(venc < todayCutoff()) return 'Vencido';
  return 'Vigente';
}
function diasEspera(m){
  return Math.max(0, daysBetween(parseDMY(m.fecha), todayCutoff()));
}

function calcCancelacionAnticipada(p, fechaPagoStr){
  const fPrestamo = parseDMY(p.fecha);
  const fPago = parseDMY(fechaPagoStr);
  const interesPorMes = p.intereses / p.plazo;
  if(fPago <= fPrestamo){
    return {mesesCobrados:0, interesPorMes, rebajaSugerida:0, totalAPagarEseDia: saldoConfirmado(p), diasParaVencimiento: daysBetween(fPago, parseDMY(p.vencimiento)), aplica:false};
  }
  let meses = 0;
  while(addMonthsSameDay(fPrestamo, meses+1) <= fPago && meses < p.plazo){ meses++; }
  const ultimoAniversario = addMonthsSameDay(fPrestamo, meses);
  const diasExtra = daysBetween(ultimoAniversario, fPago);
  let mesesCobrados = meses;
  if(diasExtra >= CONFIG.umbralDias) mesesCobrados++;
  mesesCobrados = Math.min(mesesCobrados, p.plazo);
  const venc = parseDMY(p.vencimiento);
  const diasParaVencimiento = daysBetween(fPago, venc);
  let rebajaSugerida = 0;
  let aplica = false;
  if(diasParaVencimiento >= CONFIG.umbralDias && mesesCobrados < p.plazo){
    rebajaSugerida = (p.plazo - mesesCobrados) * interesPorMes;
    if(CONFIG.redondeoActivo) rebajaSugerida = roundToMultiple(rebajaSugerida, CONFIG.redondeoMultiplo);
    aplica = true;
  }
  const totalAPagarEseDia = Math.max(0, saldoConfirmado(p) - rebajaSugerida);
  return {mesesCobrados, interesPorMes, rebajaSugerida, totalAPagarEseDia, diasParaVencimiento, aplica};
}

function calcResumen(){
  const ps = SEED.prestamos;
  let vigentes=0, vencidos=0, cancelados=0, capitalNoCancelado=0, saldoPorCobrar=0, saldoVencido=0, totalAbonadoHoy=0;
  ps.forEach(p=>{
    const estado = calcEstado(p);
    const saldo = saldoConfirmado(p);
    if(estado==='Vigente') vigentes++;
    else if(estado==='Vencido') vencidos++;
    else cancelados++;
    if(estado!=='Cancelado') capitalNoCancelado += p.monto;
    saldoPorCobrar += saldo;
    if(estado==='Vencido') saldoVencido += saldo;
    totalAbonadoHoy += totalAbonadoConfirmado(p.id);
  });
  return {vigentes, vencidos, cancelados, capitalNoCancelado, saldoPorCobrar, saldoVencido, totalAbonadoHoy, totalPrestamos: ps.length};
}
function capitalInicialTotal(){ return SEED.socios.reduce((s,x)=>s+x.capital,0); }
function totalDesembolsado(){ return SEED.prestamos.reduce((s,p)=>s+p.monto,0); }
function efectivoEsperado(){
  const totalAbonadoTodos = SEED.prestamos.reduce((s,p)=>s+totalAbonadoConfirmado(p.id),0);
  return capitalInicialTotal() + totalAbonadoTodos - totalDesembolsado();
}

/* ---------- Tesorería: efectivo en caja vs dinero en bancos ----------
   Sinpe Móvil y Transferencia mueven dinero bancario; Efectivo mueve caja.
   Saber en cuál bolsa está el dinero decide por qué método se puede
   desembolsar un préstamo nuevo. */
function esMetodoEfectivo(metodo){ return metodo === 'Efectivo'; }
function abonosConfirmadosPorBolsa(){
  let efectivo = 0, bancos = 0;
  MOVS.forEach(m=>{
    if(m.estado!=='aprobado' && m.estado!=='aprobado_caja') return;
    const neto = m.monto;
    if(esMetodoEfectivo(m.metodo)) efectivo += neto; else bancos += neto;
  });
  return {efectivo, bancos};
}
function desembolsosPorBolsa(){
  let efectivo = 0, bancos = 0;
  SEED.prestamos.forEach(p=>{
    if(esMetodoEfectivo(p.metodoDesembolso)) efectivo += p.monto; else bancos += p.monto;
  });
  return {efectivo, bancos};
}
function saldosDisponibles(){
  const ab = abonosConfirmadosPorBolsa();
  const des = desembolsosPorBolsa();
  const inicialEfectivo = CONFIG.saldoInicialEfectivo;
  const inicialBancos = capitalInicialTotal() - inicialEfectivo;
  const efectivo = inicialEfectivo + ab.efectivo - des.efectivo;
  const bancos = inicialBancos + ab.bancos - des.bancos;
  return {efectivo, bancos, total: efectivo + bancos};
}
function disponiblePorMetodo(metodo){
  const s = saldosDisponibles();
  return esMetodoEfectivo(metodo) ? s.efectivo : s.bancos;
}
/* Rango en que puede moverse el capital inicial en efectivo sin que ninguna de
   las dos bolsas quede en negativo con el historial ya cargado. Fuera de ese
   rango los números no cuadran con los movimientos reales. */
function rangoSaldoInicialEfectivo(){
  const ab = abonosConfirmadosPorBolsa();
  const des = desembolsosPorBolsa();
  const capital = capitalInicialTotal();
  const min = Math.max(0, Math.round(des.efectivo - ab.efectivo));
  const max = Math.min(capital, Math.max(min, Math.round(capital - Math.max(0, des.bancos - ab.bancos))));
  return {min, max};
}
/* Punto medio del rango viable: reparte el disponible mitad en caja y mitad en
   bancos. Es solo un arranque neutral para que ninguna de las dos vías quede
   bloqueada; el administrador pone el número real en Configuración. */
function calcularSaldoInicialEfectivoSugerido(){
  const {min, max} = rangoSaldoInicialEfectivo();
  return Math.round((min + max) / 2);
}
function resumenPorSocio(){
  return SEED.socios.map(s=>{
    const ps = SEED.prestamos.filter(p=>p.socio===s.nombre);
    const capNoCanc = ps.filter(p=>calcEstado(p)!=='Cancelado').reduce((a,p)=>a+p.monto,0);
    const saldo = ps.reduce((a,p)=>a+saldoConfirmado(p),0);
    return {socio:s.nombre, prestamos:ps.length, capital:capNoCanc, saldo};
  });
}

function calcInteresSugerido(monto, plazo){
  let intereses = monto * (CONFIG.tasaMensual/100) * plazo;
  intereses = Math.max(intereses, CONFIG.minimoCobrado);
  if(CONFIG.redondeoActivo) intereses = roundToMultiple(intereses, CONFIG.redondeoMultiplo);
  return Math.round(intereses);
}
function nextPrestamoId(){
  let max = 0;
  SEED.prestamos.forEach(p=>{ const n = parseInt(p.id,10); if(!isNaN(n) && n>max) max=n; });
  return String(max+1);
}
async function crearSolicitud({socio, cliente, monto, plazo, metodoDesembolso, nota, detalleMetodo}){
  const socioId = socioIdPorNombre(socio);
  if(!socioId){ toast('No se pudo identificar al socio.'); return null; }

  const { data: id, error: eId } = await sb.rpc('siguiente_solicitud');
  if(eId){ toast(mensajeDeErrorSb(eId)); return null; }

  const { error } = await sb.from('solicitudes').insert({
    id,
    orden: Number(String(id).replace('S-','')),
    socio_id: socioId,
    cliente,
    monto: Math.round(monto),
    plazo_meses: Math.round(plazo),
    interes_propuesto: calcInteresSugerido(monto, plazo),
    metodo_desembolso: metodoDesembolso,
    detalle_metodo: detalleMetodo || {},
    nota: nota || '',
    fecha_solicitud: dmyAIso(SEED.fechaCorte),
    estado: 'pendiente'
  });
  if(error){ toast(mensajeDeErrorSb(error)); return null; }
  await cargarTodo();
  return true;
}
async function aprobarSolicitud(id, {monto, plazo, intereses, metodo, fechaDesembolso, comprobanteImg}){
  const sol = SOLICITUDES.find(s=>s.id===id);
  if(!sol) return null;
  const nuevoId = nextPrestamoId();
  const vencimiento = formatDMY(addMonthsSameDay(parseDMY(fechaDesembolso), plazo));

  // Primero el prestamo: si fallara, la solicitud no debe quedar marcada
  // como aprobada apuntando a un prestamo que no existe.
  const { error: eP } = await sb.from('prestamos').insert({
    numero: nuevoId,
    socio_id: sol.socioId,
    cliente: sol.cliente,
    fecha: dmyAIso(fechaDesembolso),
    monto: Math.round(monto),
    plazo_meses: Math.round(plazo),
    intereses: Math.round(intereses),
    fecha_vencimiento: dmyAIso(vencimiento),
    metodo_desembolso: metodo,
    observaciones: 'Préstamo nuevo aprobado desde solicitud ' + sol.id
  });
  if(eP){ toast(mensajeDeErrorSb(eP)); return null; }

  const { error: eS } = await sb.from('solicitudes').update({
    estado: 'aprobada',
    aprobado_por: 'Administrador',
    aprobado_en: dmyAIso(SEED.fechaCorte),
    prestamo_asignado: nuevoId,
    comprobante_url: comprobanteImg || ''
  }).eq('id', id);
  if(eS){ toast(mensajeDeErrorSb(eS)); return null; }

  await cargarTodo();
  toast('Préstamo N° ' + nuevoId + ' creado y agregado a la tabla de Préstamos.');
  return true;
}
async function rechazarSolicitud(id, motivo){
  await conGuardado(async () => {
    const { error } = await sb.from('solicitudes')
      .update({ estado:'rechazada', motivo_rechazo: motivo }).eq('id', id);
    if(error) throw error;
  }, 'Solicitud rechazada. Vuelve al socio.');
}

/* Los consecutivos de recibo y cierre los genera Postgres con una
   secuencia: dos personas confirmando a la vez no pueden repetir numero. */

async function generarRecibo(mov){
  if(!mov) return null;
  const p = prestamoById(mov.prestamoId);
  // saldoConfirmado ya incluye este movimiento (se recargo antes de llamar),
  // asi que el saldo anterior se reconstruye sumandolo de vuelta.
  const saldoNuevo = saldoConfirmado(p);
  const saldoAnterior = saldoNuevo + mov.monto + (mov.rebajaAplicada||0);

  // El consecutivo lo da Postgres: dos personas aprobando a la vez no
  // pueden terminar con el mismo numero de recibo.
  const { data: numero, error: eNum } = await sb.rpc('siguiente_recibo');
  if(eNum){ toast(mensajeDeErrorSb(eNum)); return null; }

  const fila = {
    numero,
    movimiento_id: mov.id,
    fecha: dmyAIso(SEED.fechaCorte),
    cliente: p.cliente,
    prestamo_numero: p.id,
    monto: mov.monto,
    metodo: mov.metodo,
    saldo_anterior: saldoAnterior,
    saldo_nuevo: saldoNuevo,
    proximo_vencimiento: dmyAIso(p.vencimiento)
  };
  const { error } = await sb.from('recibos').insert(fila);
  if(error){ toast(mensajeDeErrorSb(error)); return null; }

  await sb.from('movimientos').update({ recibo_numero: numero }).eq('id', mov.id);
  return filaARecibo(fila);
}

/* Generador de PDF sin librerías externas: arma el archivo a mano siguiendo
   el formato PDF estándar (objetos + tabla xref), usando la fuente base
   Helvetica que trae cualquier lector de PDF. No depende de internet. */
function pdfEscapeText(s){
  return String(s).replace(/₡/g,'C').split('').map(ch=>{
    const c = ch.charCodeAt(0);
    return c<=255 ? ch : '?';
  }).join('').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
function pdfMoney(n){
  n = Math.round(n);
  const neg = n<0;
  const s = Math.abs(n).toLocaleString('en-US');
  return (neg?'-':'') + 'C' + s;
}
/* Ancho aproximado de un texto en Helvetica, para poder alinearlo a la derecha. */
function pdfAnchoTexto(s, size){ return pdfEscapeText(s).length * size * 0.53; }

/* Ensambla el archivo PDF (objetos + tabla xref) con una o varias páginas.
   Numeración de objetos: 1 catálogo, 2 árbol de páginas, luego una página por
   hoja, luego su contenido, y al final las dos fuentes. */
function ensamblarPdf(pageW, pageH, contenidos){
  const n = contenidos.length;
  const idPrimeraPagina = 3;
  const idPrimerContenido = idPrimeraPagina + n;
  const idFuenteNormal = idPrimerContenido + n;
  const idFuenteNegrita = idFuenteNormal + 1;

  const kids = [];
  for(let i=0;i<n;i++) kids.push(`${idPrimeraPagina+i} 0 R`);

  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`
  ];
  for(let i=0;i<n;i++){
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 ${idFuenteNormal} 0 R /F2 ${idFuenteNegrita} 0 R >> >> /Contents ${idPrimerContenido+i} 0 R >>`);
  }
  contenidos.forEach(c=>{
    objs.push(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
  });
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  objs.forEach((body, i)=>{
    offsets.push(pdf.length);
    pdf += `${i+1} 0 obj\n${body}\nendobj\n`;
  });
  const xrefStart = pdf.length;
  pdf += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=objs.length;i++){ pdf += String(offsets[i]).padStart(10,'0') + ' 00000 n \n'; }
  pdf += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return pdf;
}

/* Lienzo de dibujo: acumula operadores PDF y lleva la posición vertical. */
function pdfLienzo(pageW, pageH, margen){
  const yInicial = pageH - margen - 16;
  const yPie = margen + 30;
  const marco = ['0.55 w', '0.05 0.37 0.24 RG', `10 10 ${pageW-20} ${pageH-20} re S`, '0 0 0 rg'];
  const paginas = [[]];
  let actual = 0;
  const api = {
    y: yInicial,
    get ops(){ return paginas[actual]; },
    texto(str, size, font, x){
      api.ops.push(`BT /${font} ${size} Tf ${x} ${api.y.toFixed(1)} Td (${pdfEscapeText(str)}) Tj ET`);
    },
    textoDerecha(str, size, font, xDerecho){
      const x = Math.max(margen, xDerecho - pdfAnchoTexto(String(str), size));
      api.texto(str, size, font, x);
    },
    fila(k, v, size){
      size = size || 10;
      api.texto(k, size, 'F1', margen);
      api.textoDerecha(String(v), size, 'F2', pageW - margen);
    },
    linea(){ api.ops.push(`${margen} ${api.y.toFixed(1)} m ${pageW-margen} ${api.y.toFixed(1)} l S`); },
    nuevaPagina(){ paginas.push([]); actual++; api.y = yInicial; },
    /* Reserva espacio: si el bloque no cabe en lo que queda, pasa a otra hoja. */
    asegurarEspacio(alto){ if(api.y - alto < yPie) api.nuevaPagina(); },
    bajar(n){
      api.y -= n;
      if(api.y < yPie) api.nuevaPagina();
    },
    build(){ return ensamblarPdf(pageW, pageH, paginas.map(p=>marco.concat(p).join('\n'))); }
  };
  return api;
}

/* Formato de cierre de caja: comprobante del arqueo que firman el socio
   que entrega el efectivo y el administrador que lo recibe. */
function construirPdfCierre(ci, reimpresion){
  const pageW = 612, pageH = 792, margen = 50;
  const c = pdfLienzo(pageW, pageH, margen);
  c.texto('Lazos', 22, 'F2', margen); c.bajar(24);
  if(reimpresion){ c.texto('REIMPRESION', 10, 'F2', margen); c.bajar(14); }
  c.texto(`Cierre del dia - N ${ci.numero}`, 11, 'F1', margen); c.bajar(10);
  c.linea(); c.bajar(24);

  c.fila('Fecha del cierre', ci.fecha); c.bajar(17);
  c.fila('Recibido por', ci.responsable); c.bajar(17);
  c.fila('Movimientos incluidos', ci.detalle.length + ci.otros.length); c.bajar(34);

  function seccion(titulo, filas){
    if(!filas.length) return;
    c.asegurarEspacio(64);
    c.texto(titulo, 11, 'F2', margen); c.bajar(6);
    c.linea(); c.bajar(16);
    filas.forEach(d=>{
      c.asegurarEspacio(34);
      c.texto(`${d.cliente} - Prestamo N ${d.prestamoId}`, 9, 'F1', margen);
      c.textoDerecha(pdfMoney(d.monto), 9, 'F2', pageW - margen);
      c.bajar(13);
      c.texto(`   Recibo ${d.recibo} - ${d.metodo} - socio ${d.socio} - pago del ${d.fecha}`, 7.5, 'F1', margen);
      c.bajar(15);
    });
    c.bajar(2); c.linea(); c.bajar(18);
  }

  seccion('Efectivo recibido y contado', ci.detalle);
  if(ci.detalle.length){
    c.fila('Total efectivo esperado', pdfMoney(ci.esperado), 11); c.bajar(17);
    c.fila('Total efectivo contado', pdfMoney(ci.contado), 11); c.bajar(17);
    const dif = ci.contado - ci.esperado;
    c.fila('Diferencia del arqueo', pdfMoney(dif) + (dif===0 ? ' (cuadra)' : dif>0 ? ' (sobrante)' : ' (faltante)'), 11);
    c.bajar(30);
  }

  seccion('Transferencias y Sinpe (no entran al arqueo)', ci.otros);
  if(ci.otros.length){ c.fila('Subtotal otros metodos', pdfMoney(ci.totalOtros), 11); c.bajar(30); }

  c.linea(); c.bajar(18);
  c.fila('TOTAL GENERAL DEL DIA', pdfMoney(ci.totalGeneral), 12); c.bajar(34);

  c.asegurarEspacio(84); c.texto('Disponible despues del cierre', 11, 'F2', margen); c.bajar(6);
  c.linea(); c.bajar(16);
  c.fila('En efectivo (caja)', pdfMoney(ci.saldoEfectivo)); c.bajar(16);
  c.fila('En bancos (transferencia / Sinpe)', pdfMoney(ci.saldoBancos)); c.bajar(16);
  c.fila('Disponible total', pdfMoney(ci.saldoTotal), 11); c.bajar(30);

  if(ci.porSocio && ci.porSocio.length > 1){
    c.asegurarEspacio(64); c.texto('Resumen por socio', 11, 'F2', margen); c.bajar(6);
    c.linea(); c.bajar(16);
    ci.porSocio.forEach(s=>{
      c.texto(`${s.socio} (${s.cantidad} abono${s.cantidad===1?'':'s'})`, 9, 'F1', margen);
      c.textoDerecha(pdfMoney(s.monto), 9, 'F2', pageW - margen);
      c.bajar(14);
    });
    c.bajar(16);
  }

  if(ci.desglose && ci.desglose.length){
    c.asegurarEspacio(64); c.texto('Detalle del efectivo contado', 11, 'F2', margen); c.bajar(6);
    c.linea(); c.bajar(16);
    ci.desglose.forEach(d=>{
      c.texto(`${pdfMoney(d.denominacion)} x ${d.cantidad}`, 9, 'F1', margen);
      c.textoDerecha(pdfMoney(d.denominacion * d.cantidad), 9, 'F2', pageW - margen);
      c.bajar(14);
    });
    c.bajar(20);
  }

  if(ci.observaciones){
    c.asegurarEspacio(60); c.texto('Observaciones', 11, 'F2', margen); c.bajar(18);
    // Parte el texto en renglones que quepan en el ancho util.
    const palabras = String(ci.observaciones).split(/\s+/);
    let linea = '';
    const anchoMax = pageW - margen*2;
    palabras.forEach(w=>{
      const prueba = linea ? linea + ' ' + w : w;
      if(pdfAnchoTexto(prueba, 9) > anchoMax){ c.texto(linea, 9, 'F1', margen); c.bajar(13); linea = w; }
      else { linea = prueba; }
    });
    if(linea){ c.texto(linea, 9, 'F1', margen); c.bajar(13); }
    c.bajar(22);
  }

  // El bloque de firmas necesita alto propio: si no cabe, va en la hoja siguiente.
  c.asegurarEspacio(70);
  c.bajar(24);
  c.ops.push(`${margen} ${c.y.toFixed(1)} m ${margen+200} ${c.y.toFixed(1)} l S`);
  c.ops.push(`${pageW-margen-200} ${c.y.toFixed(1)} m ${pageW-margen} ${c.y.toFixed(1)} l S`);
  c.bajar(13);
  c.texto('Elaborado por (administrador)', 8, 'F1', margen);
  c.textoDerecha('Revisado por', 8, 'F1', pageW - margen);
  c.bajar(30);
  c.texto('Documento interno de control. No sustituye factura electronica.' + (reimpresion ? ' Reimpreso el '+SEED.fechaCorte+'.' : ''), 7, 'F1', margen);
  return c.build();
}
function pdfStringToBytes(str){
  const bytes = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) bytes[i] = str.charCodeAt(i) & 0xFF;
  return bytes;
}
/* Entrega del archivo al usuario. Dentro del visor de Claude la página corre
   en un iframe con sandbox: abrir una pestaña con blob: queda bloqueado en
   silencio, por eso el botón "no hacía nada". La vía soportada ahí es la
   capacidad `downloads`. Fuera del visor (el archivo .html local) se usa un
   enlace de descarga normal. */
function descargarBlobLocal(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}
async function entregarPdf(construir, nombre, etiqueta){
  let blob;
  try{
    blob = new Blob([pdfStringToBytes(construir())], {type:'application/pdf'});
  } catch(e){
    toast('No se pudo generar el PDF: ' + e.message);
    return;
  }
  toast('Generando ' + etiqueta + '...');

  let downloads = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      downloads = await window.claude.use('downloads');
    }
  } catch(e){ downloads = null; }

  if(downloads){
    try{
      await downloads.save({filename: nombre, data: blob});
      toast(etiqueta.charAt(0).toUpperCase() + etiqueta.slice(1) + ' guardado.');
    } catch(err){
      const code = err && err.code;
      if(code === 'declined') return;
      if(code === 'rate_limited'){ toast('Esperá un momento e intentá de nuevo.'); return; }
      toast('No se pudo guardar el PDF' + (err && err.message ? ': ' + err.message : '.'));
    }
    return;
  }
  descargarBlobLocal(blob, nombre);
}
function abrirPdfRecibo(numero, reimpresion){
  const r = RECIBOS.find(x=>x.numero===numero);
  if(!r) return;
  return entregarPdf(

async function aprobarAbono(movId, {montoFinal, rebajaFinal, motivo} = {}){
  const m = MOVS.find(x=>String(x.id)===String(movId));
  if(!m) return;

  const cambios = { estado:'aprobado', aprobado_por:'Administrador', aprobado_en: dmyAIso(SEED.fechaCorte) };
  if(montoFinal !== undefined && Math.round(montoFinal) !== m.monto) cambios.monto = Math.round(montoFinal);
  if(rebajaFinal !== undefined) cambios.rebaja_aplicada = Math.round(rebajaFinal);
  if(motivo) cambios.motivo_ajuste = motivo;

  const { error } = await sb.from('movimientos').update(cambios).eq('id', m.id);
  if(error){ toast(mensajeDeErrorSb(error)); return; }

  // El recibo se emite con los saldos ya actualizados, por eso se recarga antes.
  await cargarTodo();
  const recibo = await generarRecibo(MOVS.find(x=>String(x.id)===String(movId)));
  await cargarTodo();
  if(recibo){ STATE.modal = {type:'recibo', recibo}; toast('Abono aprobado. Recibo ' + recibo.numero + ' generado.'); }
  render();
}

/* Suma lo marcado como recibido y refresca esperado y diferencia del cierre del día. */
function actualizarTotalesCaja(){
  let esperado = 0;
  document.querySelectorAll('.caja-check[data-mov]').forEach(c=>{
    if(!c.checked) return;
    const inp = document.querySelector(`.caja-monto-input[data-mov="${c.dataset.mov}"]`);

  });

  if(espEl) espEl.value = formatMoney(esperado);

  const totEl = document.getElementById('caja-total-general');
  if(totEl) totEl.textContent = formatMoney(esperado + totalOtros);

  difEl.innerHTML = `<div class="kv"><span class="k">Diferencia (contado − esperado)</span><span class="v" style="color:${dif===0?'var(--success)':'var(--danger)'}">${formatMoney(dif)} · ${etiqueta}</span></div>`;
}
/* Abonos ya aprobados que NO son efectivo (transferencia, Sinpe) y todavía no
   entraron en ningún cierre. Se registran en el cierre del día como respaldo,
   pero quedan fuera del arqueo porque no hay dinero físico que contar. */
function movsOtrosMetodosPendientesCierre(){
  return MOVS.filter(m=> m.tipo==='abono' && m.estado==='aprobado' && m.reciboNumero && !m.cierreNumero);
}
function detalleDesdeMov(mov, numeroRecibo){
  const p = prestamoById(mov.prestamoId);
  return {
    recibo: numeroRecibo,
    cliente: p ? p.cliente : '',
    prestamoId: mov.prestamoId,
    socio: p ? p.socio : '',
    metodo: mov.metodo,
    monto: mov.monto,
    fecha: mov.fecha,
    registradoPor: mov.registradoPor
  };

async function registrarCierreCaja({recibos, otrosMovs, esperado, contado, desglose, observaciones}){
  otrosMovs = otrosMovs || [];

  const { data: numero, error: eNum } = await sb.rpc('siguiente_cierre');
  if(eNum){ toast(mensajeDeErrorSb(eNum)); return null; }

  const detalle = recibos.map(r=>{
    const mov = MOVS.find(m=>String(m.id)===String(r.movId));
    return mov ? detalleDesdeMov(mov, r.numero)
               : {recibo:r.numero, cliente:r.cliente, prestamoId:r.prestamoId, socio:'', metodo:r.metodo, monto:r.monto, fecha:r.fecha, registradoPor:''};
  });
  const otros = otrosMovs.map(m=>detalleDesdeMov(m, m.reciboNumero));

  const porSocio = [];
  detalle.concat(otros).forEach(d=>{
    const fila = porSocio.find(x=>x.socio===d.socio);
    if(fila){ fila.cantidad++; fila.monto += d.monto; }
    else porSocio.push({socio:d.socio, cantidad:1, monto:d.monto});
  });

  const totalOtros = otros.reduce((a,d)=>a+d.monto,0);
  const saldos = saldosDisponibles();

  const { error } = await sb.from('cierres').insert({
    numero,
    fecha: dmyAIso(SEED.fechaCorte),
    responsable: 'Administrador',
    esperado, contado,
    total_otros: totalOtros,
    total_general: esperado + totalOtros,
    saldo_efectivo: saldos.efectivo,
    saldo_bancos: saldos.bancos,
    saldo_total: saldos.total,
    observaciones: observaciones || '',
    desglose: desglose || []
  });
  if(error){ toast(mensajeDeErrorSb(error)); return null; }

  // Marcar los movimientos para que no entren en dos cierres distintos.
  const ids = recibos.map(r=>r.movId).concat(otrosMovs.map(m=>m.id)).filter(Boolean);
  if(ids.length){
    await sb.from('movimientos').update({ cierre_numero: numero }).in('id', ids);
  }

  // El cierre se devuelve armado para el modal; el detalle no se guarda en
  // la tabla porque se puede reconstruir desde los movimientos marcados.
  return {
    numero, fecha: SEED.fechaCorte, responsable: 'Administrador',
    esperado, contado, totalOtros, totalGeneral: esperado + totalOtros,
    desglose: desglose || [], observaciones: observaciones || '',
    detalle, otros, porSocio,
    saldoEfectivo: saldos.efectivo, saldoBancos: saldos.bancos, saldoTotal: saldos.total
  };
}
async function reversarAbono(movId, motivo){
  const original = MOVS.find(x=>String(x.id)===String(movId));
  if(!original) return;
  await conGuardado(async () => {
    // La reversa es un movimiento espejo en negativo, no un borrado: el
    // historial tiene que mostrar que existio y que se revirtio.
    const { data, error } = await sb.from('movimientos').insert({
      prestamo_numero: original.prestamoId,
      fecha: dmyAIso(SEED.fechaCorte),
      monto: -original.monto,
      monto_reportado: -original.monto,
      metodo: original.metodo,
      nota: 'Reversa: ' + motivo,
      rebaja_aplicada: 0,
      tipo: 'reversa',
      reversa_de: original.id,
      estado: 'aprobado',
      registrado_por: 'Administrador',
      socio_id: original.socioId,
      aprobado_por: 'Administrador',
      aprobado_en: dmyAIso(SEED.fechaCorte)
    }).select('id').single();
    if(error) throw error;
    const { error: e2 } = await sb.from('movimientos')
      .update({ reversado_por: data.id }).eq('id', original.id);
    if(e2) throw e2;
  }, 'Movimiento reversado. Historial visible en el préstamo.');
}

/* ---------- SOCIO: Mi cartera ---------- */
function carteraLoansFiltradas(){
  let loans = socioLoans(STATE.socioActivo).map(p=>({p, estado: calcEstado(p), saldo: saldoConfirmado(p)}));
  if(STATE.filtroEstado === 'Cancelado'){
    loans = loans.filter(x=>x.estado==='Cancelado');
  } else {
    loans = loans.filter(x=>x.estado!=='Cancelado');
    if(STATE.filtroEstado!=='todos') loans = loans.filter(x=>x.estado===STATE.filtroEstado);
  }
  const q = (STATE.busquedaCartera||'').trim().toLowerCase();
  if(q) loans = loans.filter(x=> x.p.cliente.toLowerCase().includes(q) || x.p.id.toLowerCase().includes(q));
  loans.sort((a,b)=> (a.estado==='Vencido'?0:a.estado==='Vigente'?1:2) - (b.estado==='Vencido'?0:b.estado==='Vigente'?1:2));
  return loans;
}
function renderCarteraListInner(){
  const loans = carteraLoansFiltradas();
  if(loans.length===0) return '<div class="empty">No hay préstamos con este filtro o búsqueda.</div>';
  return loans.map(({p,estado,saldo})=>{
    const pend = totalAbonadoPendiente(p.id);
    return `<div class="loan-row" data-action="goto" data-screen="detalle" data-id="${p.id}">
      <div class="loan-main">

}

function movimientosPorSocio(socio){
  const loanIds = new Set(socioLoans(socio).map(p=>p.id));
  return MOVS.filter(m=> loanIds.has(m.prestamoId) && m.tipo==='abono');
}
function inputDateToDMY(isoStr){
  const [y,m,d] = isoStr.split('-');
  return `${d}/${m}/${y}`;
}
function renderPendientesSocioInner(socio){
  const pend = movimientosPorSocio(socio).filter(m=> m.estado==='pendiente' || m.estado==='reportado_pendiente_caja')
    .sort((a,b)=>diasEspera(b)-diasEspera(a));
  if(pend.length===0) return '<div class="empty">No tienes abonos pendientes de aprobación.</div>';
  return pend.map(m=>{
    const p = prestamoById(m.prestamoId);
    return `<div class="mov-item pendiente">
      <div class="mov-top"><span>${p.cliente} · N° ${p.id}</span>${pillMovEstado(m)}</div>
      <div class="mov-meta">${formatMoney(m.monto)} · ${m.metodo} · Fecha de pago: ${m.fecha} · ${diasEspera(m)} días esperando</div>
    </div>`;
  }).join('');
}
function renderHistorialSocioInner(socio){
  const desdeStr = STATE.historialDesde, hastaStr = STATE.historialHasta;
  const desde = desdeStr ? parseDMY(inputDateToDMY(desdeStr)) : null;
  const hasta = hastaStr ? parseDMY(inputDateToDMY(hastaStr)) : null;
  let movs = movimientosPorSocio(socio).slice().sort((a,b)=>(b.seq||0)-(a.seq||0));
  if(desde) movs = movs.filter(m=>parseDMY(m.fecha) >= desde);
  if(hasta) movs = movs.filter(m=>parseDMY(m.fecha) <= hasta);
  if(movs.length===0) return '<div class="empty">No hay abonos registrados en ese rango de fechas.</div>';
  return movs.map(m=>{
    const p = prestamoById(m.prestamoId);
    return `<div class="mov-item ${m.estado}">
      <div class="mov-top"><span>${p.cliente} · N° ${p.id}</span>${pillMovEstado(m)}</div>
      <div class="mov-meta">${formatMoney(m.monto)} · ${m.metodo} · Fecha: ${m.fecha}${m.aprobadoPor?` · Aprobado por: ${m.aprobadoPor}`:''}${m.reciboNumero?` · Recibo ${m.reciboNumero}`:''}</div>
      ${m.motivoRechazo?`<div class="mov-meta" style="color:var(--danger)">Motivo de rechazo: ${m.motivoRechazo}</div>`:''}
      ${m.reciboNumero?`<button class="btn btn-ghost btn-sm no-print" style="margin-top:6px;" data-action="pdf-recibo" data-numero="${m.reciboNumero}" data-reimpresion="1">Reimprimir recibo</button>`:''}
    </div>`;
  }).join('');
}
function renderMisPendientesYHistorial(socio){
  return `
  <div class="card">
    <h3>Mis abonos pendientes de aprobación</h3>
    <div id="mis-pendientes-list">${renderPendientesSocioInner(socio)}</div>

  }
  return '';
}

/* ---------- ADMIN: Solicitudes de préstamo ---------- */
function calcColaSolicitudes(){
  const pendientes = SOLICITUDES.filter(s=>s.estado==='pendiente').sort((a,b)=>a.orden-b.orden);
  const saldos = saldosDisponibles();
  // Cada bolsa se consume por aparte: lo que se desembolsa por banco no baja la caja.
  const restante = {efectivo: saldos.efectivo, bancos: saldos.bancos};
  const colaInfo = {};
  pendientes.forEach((s,idx)=>{
    const bolsa = esMetodoEfectivo(s.metodoDesembolso) ? 'efectivo' : 'bancos';
    const alcanza = s.monto <= restante[bolsa];
    const faltante = Math.max(0, s.monto - restante[bolsa]);
    // La otra bolsa puede cubrirlo si se cambia el método de desembolso.
    const otraBolsa = bolsa==='efectivo' ? 'bancos' : 'efectivo';
    colaInfo[s.id] = {
      numero: idx+1,
      bolsa,
      fondeable: alcanza,
      faltante,
      alternativaPosible: !alcanza && s.monto <= restante[otraBolsa],
      alternativa: otraBolsa==='efectivo' ? 'efectivo' : 'transferencia o Sinpe'
    };
    if(alcanza) restante[bolsa] -= s.monto;
  });
  return {pendientes, disponible: saldos.total, saldos, colaInfo};
}

function renderTablaRecibos(){
  const recibos = RECIBOS.slice().sort((a,b)=>b.numero.localeCompare(a.numero));
  if(recibos.length===0) return '<div class="empty">Todavía no se ha generado ningún recibo.</div>';
  const rows = recibos.map(r=>`<tr>
    <td>${r.numero}</td><td>${r.fecha}</td><td>${r.cliente}</td><td>${r.prestamoId}</td>
    <td>${formatMoney(r.monto)}</td><td>${r.metodo}</td><td>${formatMoney(r.saldoAnterior)}</td><td>${formatMoney(r.saldoNuevo)}</td>
    <td><button class="btn btn-ghost btn-sm no-print" data-action="pdf-recibo" data-numero="${r.numero}" data-reimpresion="1">Reimprimir</button></td>
  </tr>`).join('');
  return `<p class="muted">Del más reciente al más antiguo.</p><div class="table-wrap"><table>
    <thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Préstamo</th><th>Monto</th><th>Método</th><th>Saldo anterior</th><th>Saldo nuevo</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

function renderTablaCierres(){
  const cierres = CIERRES.slice().sort((a,b)=>b.numero.localeCompare(a.numero));

  const rows = cierres.map(ci=>{
    const dif = ci.contado - ci.esperado;

      <td>${ci.detalle.length + ci.otros.length}</td>

document.addEventListener('click', async function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='salir'){
    sb.auth.signOut().then(()=>{ STATE.role=null; STATE.socioActivo=null; STATE.sesion=null; render(); });
    return;
  }
  if(action==='goto'){
    const params = {};
    if(t.dataset.id) params.id = t.dataset.id;
    if(t.dataset.preselect) params.preselect = t.dataset.preselect;
    goto(t.dataset.screen, params); return;
  }
  if(action==='filtro-estado'){ STATE.filtroEstado = t.dataset.val; render(); return; }
  if(action==='tabla-tab'){ STATE.screenParams = {tabla:t.dataset.val}; render(); return; }
  if(action==='toggle-theme'){
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    const isDark = cur==='dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    render(); return;
  }
  if(action==='abrir-rechazo'){ STATE.modal = {type:'rechazo', movId:t.dataset.mov}; render(); return; }
  if(action==='abrir-reversa'){ STATE.modal = {type:'reversa', movId:t.dataset.mov}; render(); return; }
  if(action==='abrir-rechazo-solicitud'){ STATE.modal = {type:'rechazo-solicitud', solId:t.dataset.sol}; render(); return; }
  if(action==='ver-imagen'){ STATE.modal = {type:'imagen', src:t.dataset.src}; render(); return; }
  if(action==='pdf-recibo'){ abrirPdfRecibo(t.dataset.numero, t.dataset.reimpresion==='1'); return; }
  if(action==='pdf-cierre'){ abrirPdfCierre(t.dataset.numero, t.dataset.reimpresion==='1'); return; }
  if(action==='quitar-comprobante'){
    const form = t.closest('form');
    form.querySelector('#comprobante-file').value = '';
    form.querySelector('input[name="comprobanteImg"]').value = '';
    form.querySelector('#comprobante-preview').innerHTML = '';
    return;
  }
  if(action==='quitar-sol-comprobante'){
    const solId = t.dataset.sol;
    document.querySelector(`.sol-comprobante-file[data-sol="${solId}"]`).value = '';
    document.querySelector(`.sol-comprobante-value[data-sol="${solId}"]`).value = '';
    document.querySelector(`.sol-comprobante-preview[data-sol="${solId}"]`).innerHTML = '';
    return;
  }
  if(action==='cerrar-modal' || action==='cerrar-modal-bg'){ if(t.dataset.action==='cerrar-modal-bg' && e.target!==t) return; closeModal(); return; }
  if(action==='confirmar-motivo'){
    const motivo = document.getElementById('motivo-texto').value.trim();
    if(!motivo){ toast('Escribe un motivo para continuar.'); return; }
    if(t.dataset.accion==='rechazar') await rechazarAbono(t.dataset.mov, motivo);
    else if(t.dataset.accion==='reversar') await reversarAbono(t.dataset.mov, motivo);
    else if(t.dataset.accion==='rechazar-solicitud') await rechazarSolicitud(t.dataset.mov, motivo);
    STATE.modal = null; render(); return;
  }
  if(action==='aprobar-solicitud'){
    const solId = t.dataset.sol;
    const monto = parseMoneyInputValue(document.querySelector(`.sol-monto[data-sol="${solId}"]`).value);
    const plazo = Number(document.querySelector(`.sol-plazo[data-sol="${solId}"]`).value);
    const intereses = parseMoneyInputValue(document.querySelector(`.sol-interes[data-sol="${solId}"]`).value);
    const metodo = document.querySelector(`.sol-metodo[data-sol="${solId}"]`).value;
    const fechaInput = document.querySelector(`.sol-fecha[data-sol="${solId}"]`).value;
    if(!monto || monto<=0 || !plazo || plazo<=0 || !fechaInput){ toast('Revisa los datos del préstamo antes de aprobar.'); return; }
    const [y,m,d] = fechaInput.split('-');
    const comprobanteImg = document.querySelector(`.sol-comprobante-value[data-sol="${solId}"]`).value;
    await aprobarSolicitud(solId, {monto, plazo, intereses, metodo, fechaDesembolso:`${d}/${m}/${y}`, comprobanteImg});
    render(); return;
  }
  if(action==='aprobar'){
    const movId = t.dataset.mov;
    const montoInput = document.querySelector(`.monto-aprobar-input[data-mov="${movId}"]`);
    const rebajaInput = document.querySelector(`.rebaja-input[data-mov="${movId}"]`);
    const montoFinal = montoInput ? parseMoneyInputValue(montoInput.value) : undefined;
    const rebajaFinal = rebajaInput ? parseMoneyInputValue(rebajaInput.value) : 0;
    const montoOriginal = Number(t.dataset.montoOriginal)||0;
    const sugerida = Number(t.dataset.suger)||0;
    const cambioMonto = montoFinal !== undefined && montoFinal !== montoOriginal;
    const cambioRebaja = rebajaFinal !== sugerida;
    if(cambioMonto || cambioRebaja){
      const wrap = document.querySelector(`.ajuste-motivo-wrap[data-mov="${movId}"]`);
      if(wrap && !wrap.querySelector('textarea')){
        wrap.innerHTML = `<div class="field"><label>Motivo del ajuste (obligatorio)</label><textarea class="ajuste-motivo-txt" placeholder="Explica por qué cambiaste el monto y/o la rebaja..."></textarea></div>`;
        toast('Indica el motivo del ajuste antes de aprobar.');
        return;
      }
      const motivoTxt = wrap.querySelector('textarea').value.trim();
      if(!motivoTxt){ toast('Indica el motivo del ajuste.'); return; }
      await aprobarAbono(movId, {montoFinal, rebajaFinal, motivo: motivoTxt});
    } else {
      await aprobarAbono(movId, {montoFinal, rebajaFinal});
    }
    return;
  }
  if(action==='confirmar-cierre-dia'){
    const checks = document.querySelectorAll(`.caja-check[data-mov]`);
    // Se lee el formulario ANTES de confirmar, porque confirmar vuelve a dibujar la pantalla.
    const contadoEl = document.getElementById('caja-contado');
    const obsEl = document.getElementById('caja-observaciones');
    const contado = contadoEl ? parseMoneyInputValue(contadoEl.value) : 0;
    const observaciones = obsEl ? obsEl.value.trim() : '';
    const desglose = [];
    document.querySelectorAll('.denom-input[data-denom]').forEach(inp=>{
      const cantidad = Math.max(0, Math.floor(Number(inp.value)||0));
      if(cantidad>0) desglose.push({denominacion: Number(inp.dataset.denom), cantidad});
    });

    const pendientes = [];
    let faltaMotivo = false;
    checks.forEach(c=>{
      const mov = MOVS.find(m=>m.id===c.dataset.mov);
      if(!mov || !c.checked) return;
      const montoInput = document.querySelector(`.caja-monto-input[data-mov="${mov.id}"]`);
      const montoFinal = montoInput ? parseMoneyInputValue(montoInput.value) : mov.monto;
      const montoOriginal = Number(c.dataset.montoOriginal)||mov.monto;
      if(montoFinal !== montoOriginal){
        const wrap = document.querySelector(`.caja-monto-motivo-wrap[data-mov="${mov.id}"]`);
        if(wrap && !wrap.querySelector('textarea')){
          wrap.innerHTML = `<div class="field"><label>Motivo del ajuste (obligatorio)</label><textarea class="caja-motivo-txt" placeholder="Explica por qué el monto contado es distinto..."></textarea></div>`;
          faltaMotivo = true; return;
        }
        const motivoTxt = wrap.querySelector('textarea').value.trim();
        if(!motivoTxt){ faltaMotivo = true; return; }
        pendientes.push({movId: mov.id, montoFinal, motivo: motivoTxt});
      } else {
        pendientes.push({movId: mov.id, montoFinal});
      }
    });
    if(faltaMotivo){ toast('Indica el motivo del ajuste antes de confirmar.'); return; }
    const otrosMovs = movsOtrosMetodosPendientesCierre();
    if(!pendientes.length && !otrosMovs.length){ toast('Marca al menos un abono como recibido.'); return; }

    // Se confirman uno por uno y despues se recarga: los recibos se emiten
    // con los saldos ya actualizados por todas las confirmaciones.
    const movIds = [];
    for(const pen of pendientes){
      const id = await confirmarCaja(pen.movId, pen.montoFinal, pen.motivo);
      if(id) movIds.push(id);
    }
    if(!movIds.length && !otrosMovs.length){ toast('No se pudo confirmar ningún abono.'); return; }

    await cargarTodo();
    const recibos = [];
    for(const id of movIds){
      const r = await generarRecibo(MOVS.find(m=>String(m.id)===String(id)));
      if(r) recibos.push(r);
      await cargarTodo();
    }

    const esperado = recibos.reduce((a,r)=>a+r.monto,0);
    const cierre = await registrarCierreCaja({recibos, otrosMovs, esperado, contado, desglose, observaciones});
    await cargarTodo();
    if(!cierre) return;
    STATE.modal = {type:'cierre', cierre};
    toast('Cierre ' + cierre.numero + ' registrado. ' + (recibos.length + otrosMovs.length) + ' recibo(s).');
    render(); return;
  }
  if(action==='guardar-config'){
    CONFIG.tasaMensual = Number(document.getElementById('cfg-tasa').value)||0;
    CONFIG.minimoCobrado = parseMoneyInputValue(document.getElementById('cfg-minimo').value);
    CONFIG.redondeoActivo = document.getElementById('cfg-redondeo').checked;
    CONFIG.redondeoMultiplo = parseMoneyInputValue(document.getElementById('cfg-redondeo-mult').value) || 1000;
    CONFIG.umbralDias = Number(document.getElementById('cfg-umbral').value)||15;
    CONFIG.socioAdmin = document.getElementById('cfg-socio-admin').value;
    const pedido = parseMoneyInputValue(document.getElementById('cfg-saldo-efectivo').value);
    const rango = rangoSaldoInicialEfectivo();
    CONFIG.saldoInicialEfectivo = Math.min(rango.max, Math.max(rango.min, pedido));
    const ajustado = CONFIG.saldoInicialEfectivo !== pedido;

    const { error } = await sb.from('config').update({
      tasa_mensual: CONFIG.tasaMensual,
      minimo_cobrado: CONFIG.minimoCobrado,
      redondeo_activo: CONFIG.redondeoActivo,
      redondeo_multiplo: CONFIG.redondeoMultiplo,
      umbral_dias: CONFIG.umbralDias,
      socio_admin: CONFIG.socioAdmin,
      saldo_inicial_efectivo: CONFIG.saldoInicialEfectivo,
      actualizado_en: new Date().toISOString()
    }).eq('id', true);

    if(error){ toast(mensajeDeErrorSb(error)); render(); return; }
    await cargarTodo();
    toast(ajustado
      ? `Guardado. El capital en efectivo se ajustó a ${formatMoney(CONFIG.saldoInicialEfectivo)}: fuera de ese rango una de las bolsas quedaría en negativo.`
      : 'Configuración guardada.');
    render(); return;
  }
  if(action==='simular-nuevo'){
    const monto = parseMoneyInputValue(document.getElementById('simn-monto').value);
    const plazo = Number(document.getElementById('simn-plazo').value)||1;
    let intereses = monto * (CONFIG.tasaMensual/100) * plazo;
    intereses = Math.max(intereses, CONFIG.minimoCobrado);
    if(CONFIG.redondeoActivo) intereses = roundToMultiple(intereses, CONFIG.redondeoMultiplo);
    const total = monto + intereses;
    document.getElementById('simn-resultado').innerHTML = `
      <div class="kv"><span class="k">Intereses estimados</span><span class="v">${formatMoney(intereses)}</span></div>
      <div class="kv"><span class="k">Total a pagar</span><span class="v">${formatMoney(total)}</span></div>`;
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target.classList.contains('caja-check')){ actualizarTotalesCaja(); return; }

  if(e.target.id==='reg-socio'){ STATE.screenParams = {...STATE.screenParams, socioSel:e.target.value}; render(); return; }
  if(e.target.id==='sol-metodo-desembolso'){
    document.getElementById('sol-metodo-detalle').innerHTML = renderSolMetodoDetalle(e.target.value);
    return;
  }
  if(e.target.classList.contains('sol-comprobante-file')){
    const solId = e.target.dataset.sol;
    const hidden = document.querySelector(`.sol-comprobante-value[data-sol="${solId}"]`);
    const preview = document.querySelector(`.sol-comprobante-preview[data-sol="${solId}"]`);
    const file = e.target.files && e.target.files[0];
    if(!file){ hidden.value=''; preview.innerHTML=''; return; }
    preview.innerHTML = '<span class="hint">Procesando foto...</span>';
    leerComprobanteComoDataURL(file, function(dataUrl){
      hidden.value = dataUrl;
      preview.innerHTML = `<div class="comprobante-preview-wrap">
        <img src="${dataUrl}" class="comprobante-thumb" data-action="ver-imagen" data-src="${dataUrl}">
        <button type="button" class="btn btn-ghost btn-sm" data-action="quitar-sol-comprobante" data-sol="${solId}">Quitar foto</button>
      </div>`;
    });
    return;
  }
  if(e.target.id==='comprobante-file'){
    const form = e.target.closest('form');
    const hidden = form.querySelector('input[name="comprobanteImg"]');
    const preview = form.querySelector('#comprobante-preview');
    const file = e.target.files && e.target.files[0];
    if(!file){ hidden.value=''; preview.innerHTML=''; return; }
    preview.innerHTML = '<span class="hint">Procesando foto...</span>';
    leerComprobanteComoDataURL(file, function(dataUrl){
      hidden.value = dataUrl;
      preview.innerHTML = `<div class="comprobante-preview-wrap">
        <img src="${dataUrl}" class="comprobante-thumb" data-action="ver-imagen" data-src="${dataUrl}">
        <button type="button" class="btn btn-ghost btn-sm" data-action="quitar-comprobante">Quitar foto</button>
      </div>`;
    });
    return;
  }
  if(e.target.classList.contains('radio-opt')) return;
  if(e.target.name==='metodo'){
    document.querySelectorAll('.radio-opt').forEach(l=>l.classList.remove('checked'));
    e.target.closest('.radio-opt').classList.add('checked');
    return;
  }
  if(e.target.id==='sim-fecha'){
    const p = prestamoById(e.target.dataset.prestamo);
    if(!e.target.value){ document.getElementById('sim-resultado').innerHTML=''; return; }
    const [y,m,d] = e.target.value.split('-');
    const fechaStr = `${d}/${m}/${y}`;
    const r = calcCancelacionAnticipada(p, fechaStr);
    document.getElementById('sim-resultado').innerHTML = r.aplica ? `
      <div class="notice">
        <div class="kv"><span class="k">Meses cobrados</span><span class="v">${r.mesesCobrados} de ${p.plazo}</span></div>
        <div class="kv"><span class="k">Rebaja sugerida</span><span class="v">${formatMoney(r.rebajaSugerida)}</span></div>
        <div class="kv"><span class="k">Total a pagar ese día</span><span class="v">${formatMoney(r.totalAPagarEseDia)}</span></div>
      </div>` : `<div class="notice warn">No aplica rebaja para esta fecha (a menos de ${CONFIG.umbralDias} días del vencimiento, o ya se cobraron todos los meses).</div>`;
    return;
  }
  if(e.target.id==='historial-desde' || e.target.id==='historial-hasta'){
    STATE.historialDesde = document.getElementById('historial-desde').value;
    STATE.historialHasta = document.getElementById('historial-hasta').value;
    const list = document.getElementById('historial-socio-list');
    if(list) list.innerHTML = renderHistorialSocioInner(STATE.socioActivo);
    return;
  }
});

function renderClienteSuggestions(form, query){
  const list = form.querySelector('#cliente-suggestions');
  if(!list) return;
  const socio = form.dataset.socio;
  const loans = socioLoans(socio).filter(p=>calcEstado(p)!=='Cancelado');
  const q = query.trim().toLowerCase();
  const matches = (q ? loans.filter(p=> p.cliente.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)) : loans).slice(0,8);
  if(matches.length===0){
    list.innerHTML = '<div class="autocomplete-empty">Sin préstamos vigentes con ese nombre.</div>';
  } else {
    list.innerHTML = matches.map(p=>`<div class="autocomplete-item" data-id="${p.id}">
      <div class="ac-name">${p.cliente}</div>
      <div class="ac-meta">N° ${p.id} · saldo ${formatMoney(saldoConfirmado(p))}</div>
    </div>`).join('');
  }
  list.hidden = false;
}

document.addEventListener('mousedown', function(e){
  const item = e.target.closest('.autocomplete-item');
  if(!item) return;
  e.preventDefault();
  const form = item.closest('form');
  const p = prestamoById(item.dataset.id);
  if(!p) return;
  form.querySelector('#buscar-cliente').value = p.cliente;
  form.querySelector('#prestamoId-value').value = p.id;
  const hint = form.querySelector('#prestamo-elegido');
  if(hint) hint.textContent = `Seleccionado: N° ${p.id} · ${p.cliente} · saldo ${formatMoney(saldoConfirmado(p))}`;
  const list = form.querySelector('#cliente-suggestions');
  if(list) list.hidden = true;
});

document.addEventListener('focusin', function(e){
  if(e.target.id==='buscar-cliente'){
    renderClienteSuggestions(e.target.closest('form'), e.target.value);
  }
});

document.addEventListener('click', function(e){
  if(!e.target.closest('.autocomplete-wrap')){
    document.querySelectorAll('.autocomplete-list').forEach(list=>{ list.hidden = true; });
  }
});

document.addEventListener('input', function(e){
  if(e.target.classList.contains('money-input')){
    formatMoneyInputLive(e.target);
  }
  if(e.target.id==='sol-monto' || e.target.id==='sol-plazo'){
    const monto = parseMoneyInputValue(document.getElementById('sol-monto').value);
    const plazo = Number(document.getElementById('sol-plazo').value)||0;
    const prev = document.getElementById('sol-preview');
    if(monto>0 && plazo>0){
      const intereses = calcInteresSugerido(monto, plazo);
      prev.innerHTML = `Interés estimado (${CONFIG.tasaMensual}% mensual): <b>${formatMoney(intereses)}</b> · Total a pagar: <b>${formatMoney(monto+intereses)}</b>`;
    } else {
      prev.textContent = `Escribe el monto y el plazo para ver el interés estimado (tasa actual: ${CONFIG.tasaMensual}% mensual).`;
    }
    return;
  }
  if(e.target.classList.contains('denom-input')){
    let total = 0;
    document.querySelectorAll('.denom-input[data-denom]').forEach(inp=>{
      const denom = Number(inp.dataset.denom);
      const cant = Math.max(0, Math.floor(Number(inp.value)||0));
      const sub = denom * cant;
      total += sub;
      const celda = document.querySelector(`.denom-sub[data-denom="${denom}"]`);
      if(celda) celda.textContent = formatMoney(sub);
    });
    const totEl = document.getElementById('denom-total');
    if(totEl) totEl.textContent = formatMoney(total);
    const contadoEl = document.getElementById('caja-contado');
    if(contadoEl) contadoEl.value = moneyInputValue(total);
    actualizarTotalesCaja();
    return;
  }
  if(e.target.id==='caja-contado' || e.target.classList.contains('caja-monto-input')){
    actualizarTotalesCaja();
    return;
  }
  if(e.target.id==='buscar-cliente'){
    const form = e.target.closest('form');
    form.querySelector('#prestamoId-value').value = '';
    const hint = form.querySelector('#prestamo-elegido');
    if(hint) hint.textContent = 'Escribe para buscar y toca un préstamo de la lista.';
    renderClienteSuggestions(form, e.target.value);
  }
  if(e.target.id==='buscar-cartera'){
    STATE.busquedaCartera = e.target.value;
    const list = document.getElementById('cartera-list');
    if(list) list.innerHTML = renderCarteraListInner();
  }
});

document.addEventListener('submit', async function(e){
  if(e.target.dataset.form==='registrar-abono'){
    e.preventDefault();
    const f = e.target;
    const prestamoId = f.prestamoId.value;
    if(!prestamoId){ toast('Elige un préstamo.'); return; }
    const fechaInput = f.fecha.value;
    if(!fechaInput){ toast('Elige la fecha real de pago.'); return; }
    const [y,m,d] = fechaInput.split('-');
    const fechaStr = `${d}/${m}/${y}`;
    const monto = parseMoneyInputValue(f.monto.value);
    if(!monto || monto<=0){ toast('Escribe un monto válido.'); return; }
    const metodo = f.metodo.value;
    const nota = f.nota.value;
    const p = prestamoById(prestamoId);
    const suger = calcCancelacionAnticipada(p, fechaStr);
    // La rebaja por cancelación anticipada solo aplica si este abono realmente salda el préstamo,
    // no a cualquier abono parcial dentro del plazo.
    const esCancelacionTemprana = suger.aplica && monto >= (saldoConfirmado(p) - suger.rebajaSugerida - 1);
    const esAdmin = f.dataset.admin==='1';
    const socioObjetivo = f.dataset.socio;
    const comprobanteImg = f.comprobanteImg.value;
    await registrarAbono({prestamoId, fecha:fechaStr, monto, metodo, nota, rebaja: esCancelacionTemprana?suger.rebajaSugerida:0, porAdmin:esAdmin, socioObjetivo, comprobanteImg});
    goto(esAdmin?'aprobar':'cartera');
  }
  if(e.target.dataset.form==='solicitar-prestamo'){
    e.preventDefault();
    const f = e.target;
    const cliente = f.cliente.value.trim();
    const monto = parseMoneyInputValue(f.monto.value);
    const plazo = Number(f.plazo.value);
    const metodo = f.metodo.value;
    const nota = f.nota.value;
    if(!cliente){ toast('Escribe el nombre del cliente.'); return; }
    if(!monto || monto<=0){ toast('Escribe un monto válido.'); return; }
    if(!plazo || plazo<=0){ toast('Escribe un plazo válido.'); return; }
    const detalleMetodo = {};
    if(metodo==='SINPE Móvil'){
      detalleMetodo.sinpeTelefono = f.sinpeTelefono.value.trim();
      detalleMetodo.sinpeNombre = f.sinpeNombre.value.trim();
    } else if(metodo==='Transferencia'){
      detalleMetodo.cuentaNumero = f.cuentaNumero.value.trim();
    } else if(metodo==='Efectivo'){
      detalleMetodo.entregaDetalle = f.entregaDetalle.value.trim();
    }
    await crearSolicitud({socio:STATE.socioActivo, cliente, monto, plazo, metodoDesembolso:metodo, nota, detalleMetodo});
    toast('Solicitud enviada. Queda pendiente de aprobación del administrador.');
    render();
  }
});

/* init */
/* =========================================================
   ARRANQUE
   ========================================================= */
function avisoLogin(msg){
  const el = document.getElementById('login-aviso');
  if(!el) return;
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function mensajeDeLogin(error){
  const m = (error && error.message ? error.message : String(error)).toLowerCase();
  if(m.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
  if(m.includes('email not confirmed'))       return 'La cuenta todavía no está confirmada.';
  if(m.includes('failed to fetch'))           return 'Sin conexión. Revisá tu internet.';
  return (error && error.message) ? error.message : 'No se pudo entrar.';
}

/* El formulario se dibuja y se borra en cada render, asi que el envio se
   escucha en el documento en vez de en el formulario. */
document.addEventListener('submit', async function(e){
  if(e.target.id !== 'form-login') return;
  e.preventDefault();
  avisoLogin('');
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Entrando...';

  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('correo').value.trim(),
    password: document.getElementById('clave').value
  });
  btn.disabled = false; btn.textContent = 'Entrar';
  if(error){ avisoLogin(mensajeDeLogin(error)); return; }
  await entrar(data.session);
});

/* Traduce el perfil de la base al estado que ya usaban las pantallas. */
async function entrar(sesion){
  STATE.sesion = sesion;
  const { data: perfil, error } = await sb
    .from('perfiles').select('rol, socio_id').eq('id', sesion.user.id).maybeSingle();

  if(error){ avisoLogin(mensajeDeErrorSb(error)); return; }
  if(!perfil){
    await sb.auth.signOut();
    STATE.sesion = null;
    render();
    avisoLogin('Tu cuenta todavía no está habilitada. Pedile al administrador que te asigne un rol.');
    return;
  }

  try{
    await cargarTodo();
  }catch(e){
    avisoLogin(mensajeDeErrorSb(e));
    return;
  }

  STATE.role = perfil.rol === 'administrador' ? 'admin' : 'socio';
  const socio = SEED.socios.find(x => x.id === perfil.socio_id);
  STATE.socioActivo = socio ? socio.nombre : null;

  // Un administrador que ademas es socio entra como administrador: el rol
  // mas amplio manda, y desde ahi ve tambien su propia cartera.
  STATE.screen = STATE.role === 'admin' ? 'tablero' : 'cartera';
  STATE.screenParams = {};
  CONFIG.saldoInicialEfectivo = CONFIG.saldoInicialEfectivo || calcularSaldoInicialEfectivoSugerido();
  render();
}

(async function arrancar(){
  if(!iniciarSupabase()){
    document.getElementById('app').innerHTML =
      '<div style="padding:40px;text-align:center;font-family:sans-serif;">' +
      'Falta configurar la conexión con Supabase en <code>config.js</code>.</div>';
    return;
  }
  render();   // pinta el login mientras se revisa si hay sesion guardada
  const { data } = await sb.auth.getSession();
  if(data.session) await entrar(data.session);
})();
</script>
