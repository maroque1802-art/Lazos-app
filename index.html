<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lazos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0D5E3C; --verde-osc:#0a4a30; --ambar:#F9A82E; --hoja:#358340;
  --bg:#F6F8F7; --card:#FFFFFF; --bg-alt:#EEF3F0;
  --texto:#1B2420; --muted:#5A6B62; --borde:#DDE5E0;
  --danger:#C0392B; --ok:#1E7A4C;
  --radio:14px; --radio-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --card:#1A211D; --bg-alt:#202823;
    --texto:#E8EFEA; --muted:#9BAAA1; --borde:#2C3630;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--texto);
  font-family:'Nunito Sans',system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Quicksand',system-ui,sans-serif; margin:0; line-height:1.25;}

.oculto{display:none !important;}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:24px 16px;
}
.marca{display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:26px;}
.marca .nombre{
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:40px;
  color:var(--verde); letter-spacing:-0.5px;
}
.marca .lema{color:var(--muted); font-size:14px;}
.marca .hoja{width:46px; height:5px; background:var(--ambar); border-radius:99px;}

.tarjeta{
  background:var(--card); border:1px solid var(--borde);
  border-radius:var(--radio); padding:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.login-wrap .tarjeta{width:100%; max-width:380px;}

.campo{margin-bottom:14px;}
.campo label{display:block; font-size:13.5px; font-weight:700; margin-bottom:6px;}
.campo input{
  width:100%; padding:12px 14px; font-size:16px; font-family:inherit;
  border:1px solid var(--borde); border-radius:var(--radio-sm);
  background:var(--bg); color:var(--texto);
}
.campo input:focus{outline:2px solid var(--verde); outline-offset:1px; border-color:transparent;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; font-size:15.5px; font-weight:700; font-family:inherit;
  border:none; border-radius:var(--radio-sm); cursor:pointer;
  background:var(--verde); color:#fff; transition:background .15s;
}
.btn:hover:not(:disabled){background:var(--verde-osc);}
.btn:disabled{opacity:.6; cursor:default;}
.btn-block{width:100%;}
.btn-ghost{
  background:transparent; color:var(--verde);
  border:1px solid var(--borde); font-size:14px; padding:8px 14px;
}
.btn-ghost:hover:not(:disabled){background:var(--bg-alt);}

.aviso{
  padding:11px 13px; border-radius:var(--radio-sm); font-size:14px;
  margin-bottom:14px; border-left:4px solid;
}
.aviso-error{background:rgba(192,57,43,.09); border-color:var(--danger); color:var(--danger);}
.aviso-info{background:var(--bg-alt); border-color:var(--ambar); color:var(--muted);}

/* ---------- App ---------- */
.barra{
  position:sticky; top:0; z-index:10;
  background:var(--verde); color:#fff;
  padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.barra .nombre{font-family:'Quicksand',sans-serif; font-weight:700; font-size:22px;}
.barra .quien{font-size:12px; opacity:.85; line-height:1.3;}
.barra .btn-salir{
  background:rgba(255,255,255,.15); color:#fff; border:none;
  padding:7px 12px; border-radius:99px; font-size:13px; font-weight:700;
  font-family:inherit; cursor:pointer; flex-shrink:0;
}
.barra .btn-salir:hover{background:rgba(255,255,255,.25);}

.contenido{max-width:760px; margin:0 auto; padding:16px;}

.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;}
.stat{
  background:var(--card); border:1px solid var(--borde);
  border-radius:var(--radio-sm); padding:12px 14px;
}
.stat .lbl{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
.stat .num{font-family:'Quicksand',sans-serif; font-weight:700; font-size:21px; margin-top:3px;}
.stat.acento{border-color:var(--verde); background:var(--bg-alt);}

.titulo-seccion{
  display:flex; align-items:baseline; justify-content:space-between;
  margin:0 2px 10px; gap:10px;
}
.titulo-seccion h2{font-size:19px;}
.titulo-seccion .cuenta{font-size:13px; color:var(--muted);}

.prestamo{
  background:var(--card); border:1px solid var(--borde);
  border-radius:var(--radio-sm); padding:13px 15px; margin-bottom:9px;
}
.prestamo .fila-1{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:10px; margin-bottom:7px;
}
.prestamo .cliente{font-weight:700; font-size:15.5px;}
.prestamo .meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
.prestamo .montos{display:flex; flex-direction:column; gap:3px; margin-top:8px;}
.kv{display:flex; justify-content:space-between; font-size:14px; gap:12px;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:700;}
.kv.saldo .v{font-size:16px;}

.pill{
  display:inline-block; padding:3px 10px; border-radius:99px;
  font-size:11.5px; font-weight:700; white-space:nowrap; flex-shrink:0;
}
.pill-vigente{background:rgba(30,122,76,.13); color:var(--ok);}
.pill-vencido{background:rgba(192,57,43,.13); color:var(--danger);}
.pill-cancelado{background:var(--bg-alt); color:var(--muted);}

.filtros{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:13px;}
.chip{
  padding:6px 13px; border-radius:99px; border:1px solid var(--borde);
  background:var(--card); color:var(--muted); font-size:13.5px; font-weight:700;
  font-family:inherit; cursor:pointer;
}
.chip.activo{background:var(--verde); border-color:var(--verde); color:#fff;}

.vacio{
  text-align:center; padding:34px 18px; color:var(--muted);
  background:var(--card); border:1px dashed var(--borde); border-radius:var(--radio-sm);
}
.cargando{text-align:center; padding:40px 18px; color:var(--muted);}

.pie{text-align:center; font-size:12px; color:var(--muted); padding:22px 16px 30px;}

@media (min-width:600px){
  .stats{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>
<body>

<!-- =============== LOGIN =============== -->
<div id="pantalla-login" class="login-wrap">
  <div class="marca">
    <div class="nombre">Lazos</div>
    <div class="hoja"></div>
    <div class="lema">Control de cartera</div>
  </div>

  <div class="tarjeta">
    <div id="login-aviso" class="aviso aviso-error oculto"></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" autocomplete="username"
               inputmode="email" required placeholder="tu@correo.com">
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave"
               autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" id="btn-entrar" class="btn btn-block">Entrar</button>
    </form>
  </div>

  <div class="pie">Acceso solo para socios y administración de Lazos.</div>
</div>

<!-- =============== APP =============== -->
<div id="pantalla-app" class="oculto">
  <div class="barra">
    <div>
      <div class="nombre">Lazos</div>
      <div class="quien" id="barra-quien"></div>
    </div>
    <button class="btn-salir" id="btn-salir">Salir</button>
  </div>

  <div class="contenido">
    <div id="app-aviso" class="aviso aviso-error oculto"></div>

    <div class="stats" id="stats"></div>

    <div class="titulo-seccion">
      <h2 id="titulo-cartera">Mi cartera</h2>
      <span class="cuenta" id="cuenta-prestamos"></span>
    </div>

    <div class="filtros" id="filtros">
      <button class="chip activo" data-estado="Activos">Activos</button>
      <button class="chip" data-estado="Vigente">Vigentes</button>
      <button class="chip" data-estado="Vencido">Vencidos</button>
      <button class="chip" data-estado="Cancelado">Cancelados</button>
      <button class="chip" data-estado="Todos">Todos</button>
    </div>

    <div id="lista"></div>
  </div>

  <div class="pie">Lazos · datos en vivo desde Supabase</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* =========================================================
   Lazos · login y Mi cartera
   Los datos NO se filtran aquí: los filtra Postgres con RLS.
   Esta pantalla pide "todos los préstamos" y la base devuelve
   únicamente los que a este usuario le corresponden.
   ========================================================= */

const $ = (id) => document.getElementById(id);

let sb = null;          // cliente de Supabase
let perfil = null;      // {rol, socio_id}
let prestamos = [];     // lo que devolvió la base
let filtro = 'Activos';

/* ---------------------------------------------------- utilidades */
function formatMoney(n){
  const v = Math.round(Number(n) || 0);
  return '₡' + v.toLocaleString('en-US');
}
function formatFecha(iso){
  if(!iso) return '—';
  const [a, m, d] = String(iso).split('-');
  return `${d}/${m}/${a}`;
}
function mostrarAviso(el, mensaje, tipo){
  el.textContent = mensaje;
  el.className = 'aviso ' + (tipo === 'info' ? 'aviso-info' : 'aviso-error');
}
function ocultarAviso(el){ el.className = 'aviso oculto'; }

/* Traduce los errores de Supabase a algo que una persona entienda. */
function mensajeDeError(error){
  const m = (error && error.message ? error.message : String(error)).toLowerCase();
  if(m.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
  if(m.includes('email not confirmed'))       return 'La cuenta todavía no está confirmada.';
  if(m.includes('failed to fetch') || m.includes('networkerror'))
    return 'No se pudo conectar. Revisá tu conexión a internet.';
  if(m.includes('permission denied'))
    return 'Tu cuenta no tiene permiso para ver estos datos. Avisale al administrador.';
  return error && error.message ? error.message : 'Ocurrió un error inesperado.';
}

/* ---------------------------------------------------- arranque */
function iniciar(){
  if(typeof CONFIG === 'undefined' || !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY
     || CONFIG.SUPABASE_ANON_KEY.startsWith('PEGA_')){
    mostrarAviso($('login-aviso'),
      'Falta configurar la conexión. Abrí el archivo config.js y pegá la llave anon de Supabase.',
      'info');
    $('btn-entrar').disabled = true;
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  // Si ya había sesión guardada, entra directo.
  sb.auth.getSession().then(({ data }) => {
    if(data.session) entrarALaApp(data.session);
  });

  sb.auth.onAuthStateChange((evento, sesion) => {
    if(evento === 'SIGNED_OUT') mostrarLogin();
  });
}

/* ---------------------------------------------------- login */
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  ocultarAviso($('login-aviso'));
  const btn = $('btn-entrar');
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const { data, error } = await sb.auth.signInWithPassword({
    email: $('correo').value.trim(),
    password: $('clave').value
  });

  btn.disabled = false;
  btn.textContent = 'Entrar';

  if(error){
    mostrarAviso($('login-aviso'), mensajeDeError(error));
    return;
  }
  $('clave').value = '';
  entrarALaApp(data.session);
});

$('btn-salir').addEventListener('click', async () => {
  await sb.auth.signOut();
  mostrarLogin();
});

function mostrarLogin(){
  perfil = null; prestamos = [];
  $('pantalla-app').classList.add('oculto');
  $('pantalla-login').classList.remove('oculto');
}

async function entrarALaApp(sesion){
  $('pantalla-login').classList.add('oculto');
  $('pantalla-app').classList.remove('oculto');
  $('lista').innerHTML = '<div class="cargando">Cargando tu cartera...</div>';
  $('barra-quien').textContent = sesion.user.email;

  await cargarPerfil(sesion);
  await cargarCartera();
}

/* ---------------------------------------------------- datos */
async function cargarPerfil(sesion){
  const { data, error } = await sb
    .from('perfiles')
    .select('rol, socio_id')
    .eq('id', sesion.user.id)
    .maybeSingle();

  if(error){
    mostrarAviso($('app-aviso'), mensajeDeError(error));
    return;
  }
  if(!data){
    // Cuenta sin perfil: existe pero no está autorizada.
    perfil = null;
    mostrarAviso($('app-aviso'),
      'Tu cuenta todavía no está habilitada. Pedile al administrador que te asigne un rol.',
      'info');
    return;
  }
  perfil = data;
  const etiqueta = data.rol === 'administrador' ? 'Administrador' : 'Socio';
  $('barra-quien').textContent = `${sesion.user.email} · ${etiqueta}`;
  $('titulo-cartera').textContent =
    data.rol === 'administrador' ? 'Cartera completa' : 'Mi cartera';
}

async function cargarCartera(){
  // Sin filtro por socio: RLS ya decide qué filas devuelve.
  const { data, error } = await sb
    .from('v_prestamos_estado')
    .select('numero, socio, cliente, fecha, monto, intereses, fecha_vencimiento, total_a_pagar, total_abonado, saldo_pendiente, estado')
    .order('fecha_vencimiento', { ascending: true });

  if(error){
    $('lista').innerHTML = '';
    mostrarAviso($('app-aviso'), mensajeDeError(error));
    return;
  }
  prestamos = data || [];
  ocultarAviso($('app-aviso'));
  pintarStats();
  pintarLista();
}

/* ---------------------------------------------------- pantalla */
function pintarStats(){
  const activos   = prestamos.filter(p => p.estado !== 'Cancelado');
  const vencidos  = prestamos.filter(p => p.estado === 'Vencido');
  const porCobrar = activos.reduce((s,p) => s + Number(p.saldo_pendiente || 0), 0);
  const enVencidos= vencidos.reduce((s,p) => s + Number(p.saldo_pendiente || 0), 0);

  $('stats').innerHTML = `
    <div class="stat acento">
      <div class="lbl">Saldo por cobrar</div>
      <div class="num">${formatMoney(porCobrar)}</div>
    </div>
    <div class="stat">
      <div class="lbl">Préstamos activos</div>
      <div class="num">${activos.length}</div>
    </div>
    <div class="stat">
      <div class="lbl">Vencidos</div>
      <div class="num" style="color:${vencidos.length ? 'var(--danger)' : 'inherit'}">${vencidos.length}</div>
    </div>
    <div class="stat">
      <div class="lbl">Saldo vencido</div>
      <div class="num" style="color:${enVencidos ? 'var(--danger)' : 'inherit'}">${formatMoney(enVencidos)}</div>
    </div>`;
}

function prestamosFiltrados(){
  if(filtro === 'Todos')   return prestamos;
  if(filtro === 'Activos') return prestamos.filter(p => p.estado !== 'Cancelado');
  return prestamos.filter(p => p.estado === filtro);
}

function pintarLista(){
  const lista = prestamosFiltrados();
  $('cuenta-prestamos').textContent =
    lista.length === 1 ? '1 préstamo' : `${lista.length} préstamos`;

  if(!prestamos.length){
    $('lista').innerHTML = perfil
      ? '<div class="vacio">No hay préstamos para mostrar.</div>'
      : '<div class="vacio">Sin acceso a la cartera.</div>';
    return;
  }
  if(!lista.length){
    $('lista').innerHTML = '<div class="vacio">Ningún préstamo con ese estado.</div>';
    return;
  }

  const esAdmin = perfil && perfil.rol === 'administrador';
  const clasePill = {Vigente:'pill-vigente', Vencido:'pill-vencido', Cancelado:'pill-cancelado'};

  $('lista').innerHTML = lista.map(p => `
    <div class="prestamo">
      <div class="fila-1">
        <div>
          <div class="cliente">${escapar(p.cliente)}</div>
          <div class="meta">N° ${escapar(p.numero)}${esAdmin ? ' · ' + escapar(p.socio) : ''}</div>
        </div>
        <span class="pill ${clasePill[p.estado] || ''}">${escapar(p.estado)}</span>
      </div>
      <div class="montos">
        <div class="kv saldo"><span class="k">Saldo pendiente</span><span class="v">${formatMoney(p.saldo_pendiente)}</span></div>
        <div class="kv"><span class="k">Abonado</span><span class="v">${formatMoney(p.total_abonado)}</span></div>
        <div class="kv"><span class="k">Total a pagar</span><span class="v">${formatMoney(p.total_a_pagar)}</span></div>
        <div class="kv"><span class="k">Vence</span><span class="v">${formatFecha(p.fecha_vencimiento)}</span></div>
      </div>
    </div>`).join('');
}

/* Los nombres vienen de la base; se escapan por si traen < o &. */
function escapar(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

$('filtros').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  filtro = chip.dataset.estado;
  document.querySelectorAll('#filtros .chip').forEach(c => c.classList.toggle('activo', c === chip));
  pintarLista();
});

iniciar();
</script>
</body>
</html>
