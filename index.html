  if(m.type==='texto-copiar') return `<div class="overlay" data-action="cerrar-modal-bg">
    <div class="modal" style="max-width:520px;">
      <div class="modal-head"><h3>Copiá este mensaje</h3><button class="close-x" data-action="cerrar-modal">✕</button></div>
      <p class="muted">El navegador no dejó copiarlo solo. Mantené el dedo sobre el texto para seleccionarlo.</p>
      <textarea readonly style="width:100%; min-height:190px;">${m.texto}</textarea>
    </div>
  </div>`;
  if(m.type==='imagen') return `<div class="overlay" data-action="cerrar-modal-bg">
    <div class="modal" style="max-width:640px;">
      <div class="modal-head"><h3>Comprobante</h3><button class="close-x" data-action="cerrar-modal">✕</button></div>
      <img src="${m.src}" class="lightbox-img" alt="Comprobante">
    </div>
  </div>`;
  return '';
}
/* Los cierres que vienen de la base no traen el detalle: no hacía falta
   guardarlo porque cada movimiento sabe en qué cierre entró. Se rehace desde
   ahí, para poder reimprimir los recibos de cualquier cierre, no solo del
   que se acaba de hacer. */
function recibosDelCierre(numero){
  return MOVS
    .filter(m => m.cierreNumero === numero && m.reciboNumero)
    .map(m => {
      const r = RECIBOS.find(x => x.numero === m.reciboNumero);
      const p = prestamoById(m.prestamoId);
      return { recibo: m.reciboNumero, cliente: r ? r.cliente : (p ? p.cliente : ''),
               metodo: m.metodo, monto: m.monto, anulado: r ? r.anulado : false };
    })
    .sort((a,b) => a.recibo.localeCompare(b.recibo));
}

function listaRecibosImprimibles(filas){
  if(!filas.length) return '<p class="muted">Este cierre no dejó recibos.</p>';
  return filas.map(d=>`
    <div class="kv" style="align-items:center; gap:8px;">
      <span class="k">${d.recibo} · ${d.cliente} · ${d.metodo} · ${formatMoney(d.monto)}${d.anulado?' · <b style="color:var(--danger)">ANULADO</b>':''}</span>
      <button class="btn btn-primary btn-sm no-print" data-action="pdf-recibo" data-numero="${d.recibo}" data-reimpresion="0">Guardar PDF</button>
    </div>`).join('');
}

      <div class="divider"></div>

      <div class="recibo">

        <table>
          <tr><td class="k">Fecha</td><td class="v">${ci.fecha}</td></tr>
          <tr><td class="k">Recibido por</td><td class="v">${ci.responsable}</td></tr>
          <tr><td class="k">Movimientos incluidos</td><td class="v">${todos.length}</td></tr>
          ${ci.detalle.length?`
          <tr><td class="k">Efectivo esperado</td><td class="v">${formatMoney(ci.esperado)}</td></tr>
          <tr><td class="k">Efectivo contado</td><td class="v">${formatMoney(ci.contado)}</td></tr>
          <tr><td class="k">Diferencia del arqueo</td><td class="v" style="color:${dif===0?'var(--success)':'var(--danger)'}">${formatMoney(dif)} · ${etiqueta}</td></tr>`:''}

document.addEventListener('click', async function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='salir'){
    sb.auth.signOut().then(()=>{
      STATE.role=null; STATE.socioActivo=null; STATE.sesion=null;
      // Sin esto, lo que cargó el administrador se queda en memoria cuando
      // entra otra persona en el mismo navegador.
      olvidarDatos();
      render();
    });
    return;
  }
  if(action==='goto'){
    const params = {};
    if(t.dataset.id) params.id = t.dataset.id;
    if(t.dataset.preselect) params.preselect = t.dataset.preselect;
    goto(t.dataset.screen, params); return;
  }
  if(action==='filtro-estado'){ STATE.filtroEstado = t.dataset.val; render(); return; }
  if(action==='tabla-tab'){ STATE.screenParams = {tabla:t.dataset.val}; render(); return; }
  if(action==='toggle-theme'){
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    const isDark = cur==='dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    render(); return;
  }
  if(action==='abrir-rechazo'){ STATE.modal = {type:'rechazo', movId:t.dataset.mov}; render(); return; }
  if(action==='abrir-reversa'){ STATE.modal = {type:'reversa', movId:t.dataset.mov}; render(); return; }
  if(action==='abrir-rechazo-solicitud'){ STATE.modal = {type:'rechazo-solicitud', solId:t.dataset.sol}; render(); return; }
  if(action==='ver-imagen'){ STATE.modal = {type:'imagen', src:t.dataset.src}; render(); return; }
  if(action==='pdf-recibo'){ abrirPdfRecibo(t.dataset.numero, t.dataset.reimpresion==='1'); return; }
  if(action==='pdf-cierre'){ abrirPdfCierre(t.dataset.numero, t.dataset.reimpresion==='1'); return; }
  if(action==='pdf-reversa'){ abrirPdfReversa(t.dataset.mov); return; }
  if(action==='ver-recibos-cierre'){ STATE.modal = {type:'recibos-cierre', numero:t.dataset.numero}; render(); return; }
  if(action==='ir-registro'){ e.preventDefault(); STATE.pantallaEntrada='registro'; avisoLogin(''); render(); return; }
  if(action==='ir-login'){ e.preventDefault(); STATE.pantallaEntrada='login'; avisoLogin(''); render(); return; }
  if(action==='cambiar-rol-acceso'){ return; }
  if(action==='copiar-invitacion'){
    const a = accesoPorCorreo(t.dataset.correo);
    if(!a) return;
    await copiarAlPortapapeles(mensajeParaSocio(a), 'Mensaje copiado. Pegalo donde se lo vayas a mandar.');
    return;
  }
  if(action==='regenerar-codigo'){ await regenerarCodigo(t.dataset.correo); return; }
  if(action==='vincular-cuenta'){ await vincularCuenta(t.dataset.correo); return; }
  if(action==='quitar-acceso'){
    const a = accesoPorCorreo(t.dataset.correo);
    if(!a) return;
    const aviso = a.tienePerfil
      ? `Vas a quitar a ${a.nombre || a.correo} de la lista. Su cuenta sigue existiendo, pero deja de ver datos.`
      : `Vas a quitar a ${a.nombre || a.correo} de la lista.`;
    if(!confirm(aviso)) return;
    await quitarAcceso(t.dataset.correo);
    return;
  }
  if(action==='quitar-comprobante'){
    const form = t.closest('form');
    form.querySelector('#comprobante-file').value = '';
    form.querySelector('input[name="comprobanteImg"]').value = '';
    form.querySelector('#comprobante-preview').innerHTML = '';
    return;
  }
  if(action==='quitar-sol-comprobante'){
    const solId = t.dataset.sol;
    document.querySelector(`.sol-comprobante-file[data-sol="${solId}"]`).value = '';
    document.querySelector(`.sol-comprobante-value[data-sol="${solId}"]`).value = '';
    document.querySelector(`.sol-comprobante-preview[data-sol="${solId}"]`).innerHTML = '';
    return;
  }
  if(action==='cerrar-modal' || action==='cerrar-modal-bg'){ if(t.dataset.action==='cerrar-modal-bg' && e.target!==t) return; closeModal(); return; }
  if(action==='confirmar-motivo'){
    const motivo = document.getElementById('motivo-texto').value.trim();
    if(!motivo){ toast('Escribe un motivo para continuar.'); return; }
    if(t.dataset.accion==='rechazar') await rechazarAbono(t.dataset.mov, motivo);
    else if(t.dataset.accion==='reversar') await reversarAbono(t.dataset.mov, motivo);
    else if(t.dataset.accion==='rechazar-solicitud') await rechazarSolicitud(t.dataset.mov, motivo);
    STATE.modal = null; render(); return;
  }
  if(action==='aprobar-solicitud'){
    const solId = t.dataset.sol;
    const monto = parseMoneyInputValue(document.querySelector(`.sol-monto[data-sol="${solId}"]`).value);
    const plazo = Number(document.querySelector(`.sol-plazo[data-sol="${solId}"]`).value);
    const intereses = parseMoneyInputValue(document.querySelector(`.sol-interes[data-sol="${solId}"]`).value);
    const metodo = document.querySelector(`.sol-metodo[data-sol="${solId}"]`).value;
    const fechaInput = document.querySelector(`.sol-fecha[data-sol="${solId}"]`).value;
    if(!monto || monto<=0 || !plazo || plazo<=0 || !fechaInput){ toast('Revisa los datos del préstamo antes de aprobar.'); return; }
    const [y,m,d] = fechaInput.split('-');
    const comprobanteImg = document.querySelector(`.sol-comprobante-value[data-sol="${solId}"]`).value;
    await aprobarSolicitud(solId, {monto, plazo, intereses, metodo, fechaDesembolso:`${d}/${m}/${y}`, comprobanteImg});
    render(); return;
  }
  if(action==='aprobar'){
    const movId = t.dataset.mov;
    const montoInput = document.querySelector(`.monto-aprobar-input[data-mov="${movId}"]`);
    const rebajaInput = document.querySelector(`.rebaja-input[data-mov="${movId}"]`);
    const montoFinal = montoInput ? parseMoneyInputValue(montoInput.value) : undefined;
    const rebajaFinal = rebajaInput ? parseMoneyInputValue(rebajaInput.value) : 0;
    const montoOriginal = Number(t.dataset.montoOriginal)||0;
    const sugerida = Number(t.dataset.suger)||0;
    const cambioMonto = montoFinal !== undefined && montoFinal !== montoOriginal;
    const cambioRebaja = rebajaFinal !== sugerida;
    if(cambioMonto || cambioRebaja){
      const wrap = document.querySelector(`.ajuste-motivo-wrap[data-mov="${movId}"]`);
      if(wrap && !wrap.querySelector('textarea')){
        wrap.innerHTML = `<div class="field"><label>Motivo del ajuste (obligatorio)</label><textarea class="ajuste-motivo-txt" placeholder="Explica por qué cambiaste el monto y/o la rebaja..."></textarea></div>`;
        toast('Indica el motivo del ajuste antes de aprobar.');
        return;
      }
      const motivoTxt = wrap.querySelector('textarea').value.trim();
      if(!motivoTxt){ toast('Indica el motivo del ajuste.'); return; }
      await aprobarAbono(movId, {montoFinal, rebajaFinal, motivo: motivoTxt});
    } else {
      await aprobarAbono(movId, {montoFinal, rebajaFinal});
    }
    return;
  }
  if(action==='confirmar-cierre-dia'){
    const checks = document.querySelectorAll(`.caja-check[data-mov]`);
    // Se lee el formulario ANTES de confirmar, porque confirmar vuelve a dibujar la pantalla.
    const contadoEl = document.getElementById('caja-contado');
    const obsEl = document.getElementById('caja-observaciones');
    const contado = contadoEl ? parseMoneyInputValue(contadoEl.value) : 0;
    const observaciones = obsEl ? obsEl.value.trim() : '';
    const desglose = [];
    document.querySelectorAll('.denom-input[data-denom]').forEach(inp=>{
      const cantidad = Math.max(0, Math.floor(Number(inp.value)||0));
      if(cantidad>0) desglose.push({denominacion: Number(inp.dataset.denom), cantidad});
    });

    const pendientes = [];
    let faltaMotivo = false;
    checks.forEach(c=>{
      const mov = movPorId(c.dataset.mov);
      if(!mov || !c.checked) return;
      const montoInput = document.querySelector(`.caja-monto-input[data-mov="${mov.id}"]`);
      const montoFinal = montoInput ? parseMoneyInputValue(montoInput.value) : mov.monto;
      const montoOriginal = Number(c.dataset.montoOriginal)||mov.monto;

      // La rebaja se vuelve a decidir aquí contra el monto que de verdad se
      // contó, no contra el que se registró. Si no alcanza para saldar, cae a
      // cero aunque el movimiento la trajera puesta y aunque el campo esté
      // escondido: lo que vale es esta cuenta, no lo que quedó en pantalla.
      const suger  = montoInput ? Number(montoInput.dataset.suger)||0 : 0;
      const aplica = montoInput ? montoInput.dataset.aplica === '1' : false;
      const saldo  = montoInput ? Number(montoInput.dataset.saldo)||0 : 0;
      const rebajaInput = document.querySelector(`.caja-rebaja-input[data-mov="${mov.id}"]`);
      const rebajaPedida = rebajaInput ? parseMoneyInputValue(rebajaInput.value) : 0;
      const alcanza = aplica && montoFinal >= (saldo - rebajaPedida - 1);
      const rebajaFinal = alcanza ? rebajaPedida : 0;
      const rebajaCambio = Math.round(rebajaFinal) !== Math.round(mov.rebajaAplicada || 0);

      if(montoFinal !== montoOriginal || rebajaCambio){
        const wrap = document.querySelector(`.caja-monto-motivo-wrap[data-mov="${mov.id}"]`);
        if(wrap && !wrap.querySelector('textarea')){
          wrap.innerHTML = `<div class="field"><label>Motivo del ajuste (obligatorio)</label><textarea class="caja-motivo-txt" placeholder="Explica por qué el monto contado o la rebaja son distintos..."></textarea></div>`;
          faltaMotivo = true; return;
        }
        const motivoTxt = wrap.querySelector('textarea').value.trim();
        if(!motivoTxt){ faltaMotivo = true; return; }
        pendientes.push({movId: mov.id, montoFinal, motivo: motivoTxt, rebajaFinal});
      } else {
        pendientes.push({movId: mov.id, montoFinal, rebajaFinal});
      }
    });
    if(faltaMotivo){ toast('Indica el motivo del ajuste antes de confirmar.'); return; }
    const otrosMovs = movsOtrosMetodosPendientesCierre();
    if(!pendientes.length && !otrosMovs.length){ toast('Marca al menos un abono como recibido.'); return; }

    // Se confirman uno por uno y despues se recarga: los recibos se emiten
    // con los saldos ya actualizados por todas las confirmaciones.
    const movIds = [];
    for(const pen of pendientes){
      const id = await confirmarCaja(pen.movId, pen.montoFinal, pen.motivo, pen.rebajaFinal);
      if(id) movIds.push(id);
    }
    if(!movIds.length && !otrosMovs.length){ toast('No se pudo confirmar ningún abono.'); return; }

    await cargarTodo();
    const recibos = [];
    for(const id of movIds){
      const r = await generarRecibo(movPorId(id));
      if(r) recibos.push(r);
      await cargarTodo();
    }

    const esperado = recibos.reduce((a,r)=>a+r.monto,0);
    const cierre = await registrarCierreCaja({recibos, otrosMovs, esperado, contado, desglose, observaciones});
    await cargarTodo();
    if(!cierre) return;
    STATE.modal = {type:'cierre', cierre};
    toast('Cierre ' + cierre.numero + ' registrado. ' + (recibos.length + otrosMovs.length) + ' recibo(s).');
    render(); return;
  }
  if(action==='guardar-config'){
    CONFIG.tasaMensual = Number(document.getElementById('cfg-tasa').value)||0;
    CONFIG.minimoCobrado = parseMoneyInputValue(document.getElementById('cfg-minimo').value);
    CONFIG.redondeoActivo = document.getElementById('cfg-redondeo').checked;
    CONFIG.redondeoMultiplo = parseMoneyInputValue(document.getElementById('cfg-redondeo-mult').value) || 1000;
    CONFIG.umbralDias = Number(document.getElementById('cfg-umbral').value)||15;
    CONFIG.socioAdmin = document.getElementById('cfg-socio-admin').value;
    const pedido = parseMoneyInputValue(document.getElementById('cfg-saldo-efectivo').value);
    const rango = rangoSaldoInicialEfectivo();
    CONFIG.saldoInicialEfectivo = Math.min(rango.max, Math.max(rango.min, pedido));
    const ajustado = CONFIG.saldoInicialEfectivo !== pedido;

    const { error } = await sb.from('config').update({
      tasa_mensual: CONFIG.tasaMensual,
      minimo_cobrado: CONFIG.minimoCobrado,
      redondeo_activo: CONFIG.redondeoActivo,
      redondeo_multiplo: CONFIG.redondeoMultiplo,
      umbral_dias: CONFIG.umbralDias,
      socio_admin: CONFIG.socioAdmin,
      saldo_inicial_efectivo: CONFIG.saldoInicialEfectivo,
      actualizado_en: new Date().toISOString()
    }).eq('id', true);

    if(error){ toast(mensajeDeErrorSb(error)); render(); return; }
    await cargarTodo();
    toast(ajustado
      ? `Guardado. El capital en efectivo se ajustó a ${formatMoney(CONFIG.saldoInicialEfectivo)}: fuera de ese rango una de las bolsas quedaría en negativo.`
      : 'Configuración guardada.');
    render(); return;
  }
  if(action==='simular-nuevo'){
    const monto = parseMoneyInputValue(document.getElementById('simn-monto').value);
    const plazo = Number(document.getElementById('simn-plazo').value)||1;
    let intereses = monto * (CONFIG.tasaMensual/100) * plazo;
    intereses = Math.max(intereses, CONFIG.minimoCobrado);
    if(CONFIG.redondeoActivo) intereses = roundToMultiple(intereses, CONFIG.redondeoMultiplo);
    const total = monto + intereses;
    document.getElementById('simn-resultado').innerHTML = `
      <div class="kv"><span class="k">Intereses estimados</span><span class="v">${formatMoney(intereses)}</span></div>
      <div class="kv"><span class="k">Total a pagar</span><span class="v">${formatMoney(total)}</span></div>`;
    return;
  }
});

function renderClienteSuggestions(form, query){
  const list = form.querySelector('#cliente-suggestions');
  if(!list) return;
  const socio = form.dataset.socio;
  const loans = socioLoans(socio).filter(p=>calcEstado(p)!=='Cancelado');
  const q = query.trim().toLowerCase();
  const matches = (q ? loans.filter(p=> p.cliente.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)) : loans).slice(0,8);
  if(matches.length===0){
    list.innerHTML = '<div class="autocomplete-empty">Sin préstamos vigentes con ese nombre.</div>';
  } else {
    list.innerHTML = matches.map(p=>`<div class="autocomplete-item" data-id="${p.id}">
      <div class="ac-name">${p.cliente}</div>
      <div class="ac-meta">N° ${p.id} · saldo ${formatMoney(saldoConfirmado(p))}</div>
    </div>`).join('');
  }
  list.hidden = false;
}

document.addEventListener('click', function(e){
  if(!e.target.closest('.autocomplete-wrap')){
    document.querySelectorAll('.autocomplete-list').forEach(list=>{ list.hidden = true; });
  }
});

document.addEventListener('input', function(e){
  if(e.target.classList.contains('money-input')){
    formatMoneyInputLive(e.target);
  }
  if(e.target.id==='sol-monto' || e.target.id==='sol-plazo'){
    const monto = parseMoneyInputValue(document.getElementById('sol-monto').value);
    const plazo = Number(document.getElementById('sol-plazo').value)||0;
    const prev = document.getElementById('sol-preview');
    if(monto>0 && plazo>0){
      const intereses = calcInteresSugerido(monto, plazo);
      prev.innerHTML = `Interés estimado (${CONFIG.tasaMensual}% mensual): <b>${formatMoney(intereses)}</b> · Total a pagar: <b>${formatMoney(monto+intereses)}</b>`;
    } else {
      prev.textContent = `Escribe el monto y el plazo para ver el interés estimado (tasa actual: ${CONFIG.tasaMensual}% mensual).`;
    }
    return;
  }
  if(e.target.classList.contains('denom-input')){
    let total = 0;
    document.querySelectorAll('.denom-input[data-denom]').forEach(inp=>{
      const denom = Number(inp.dataset.denom);
      const cant = Math.max(0, Math.floor(Number(inp.value)||0));
      const sub = denom * cant;
      total += sub;
      const celda = document.querySelector(`.denom-sub[data-denom="${denom}"]`);
      if(celda) celda.textContent = formatMoney(sub);
    });
    const totEl = document.getElementById('denom-total');
    if(totEl) totEl.textContent = formatMoney(total);
    const contadoEl = document.getElementById('caja-contado');
    if(contadoEl) contadoEl.value = moneyInputValue(total);
    actualizarTotalesCaja();
    return;
  }
  if(e.target.classList.contains('caja-monto-input')) revisarRebajaCaja(e.target.dataset.mov);
  if(e.target.id==='caja-contado' || e.target.classList.contains('caja-monto-input')){
    actualizarTotalesCaja();
    return;
  }
  if(e.target.id==='buscar-cliente'){
    const form = e.target.closest('form');
    form.querySelector('#prestamoId-value').value = '';
    const hint = form.querySelector('#prestamo-elegido');
    if(hint) hint.textContent = 'Escribe para buscar y toca un préstamo de la lista.';
    renderClienteSuggestions(form, e.target.value);
  }
  if(e.target.id==='buscar-cartera'){
    STATE.busquedaCartera = e.target.value;
    const list = document.getElementById('cartera-list');
    if(list) list.innerHTML = renderCarteraListInner();
  }
});

document.addEventListener('submit', async function(e){
  if(e.target.dataset.form==='registrar-abono'){
    e.preventDefault();
    const f = e.target;
    const prestamoId = f.prestamoId.value;
    if(!prestamoId){ toast('Elige un préstamo.'); return; }
    const fechaInput = f.fecha.value;
    if(!fechaInput){ toast('Elige la fecha real de pago.'); return; }
    const [y,m,d] = fechaInput.split('-');
    const fechaStr = `${d}/${m}/${y}`;
    const monto = parseMoneyInputValue(f.monto.value);
    if(!monto || monto<=0){ toast('Escribe un monto válido.'); return; }
    const metodo = f.metodo.value;
    const nota = f.nota.value;
    const p = prestamoById(prestamoId);
    const suger = calcCancelacionAnticipada(p, fechaStr);
    // La rebaja por cancelación anticipada solo aplica si este abono realmente salda el préstamo,
    // no a cualquier abono parcial dentro del plazo.
    const esCancelacionTemprana = suger.aplica && monto >= (saldoConfirmado(p) - suger.rebajaSugerida - 1);
    const esAdmin = f.dataset.admin==='1';
    const socioObjetivo = f.dataset.socio;
    const comprobanteImg = f.comprobanteImg.value;
    await registrarAbono({prestamoId, fecha:fechaStr, monto, metodo, nota, rebaja: esCancelacionTemprana?suger.rebajaSugerida:0, porAdmin:esAdmin, socioObjetivo, comprobanteImg});
    goto(esAdmin?'aprobar':'cartera');
  }
  if(e.target.dataset.form==='solicitar-prestamo'){
    e.preventDefault();
    const f = e.target;
    const cliente = f.cliente.value.trim();
    const monto = parseMoneyInputValue(f.monto.value);
    const plazo = Number(f.plazo.value);
    const metodo = f.metodo.value;
    const nota = f.nota.value;
    if(!cliente){ toast('Escribe el nombre del cliente.'); return; }
    if(!monto || monto<=0){ toast('Escribe un monto válido.'); return; }
    if(!plazo || plazo<=0){ toast('Escribe un plazo válido.'); return; }
    const detalleMetodo = {};
    if(metodo==='SINPE Móvil'){
      detalleMetodo.sinpeTelefono = f.sinpeTelefono.value.trim();
      detalleMetodo.sinpeNombre = f.sinpeNombre.value.trim();
    } else if(metodo==='Transferencia'){
      detalleMetodo.cuentaNumero = f.cuentaNumero.value.trim();
    } else if(metodo==='Efectivo'){
      detalleMetodo.entregaDetalle = f.entregaDetalle.value.trim();
    }
    await crearSolicitud({socio:STATE.socioActivo, cliente, monto, plazo, metodoDesembolso:metodo, nota, detalleMetodo});
    toast('Solicitud enviada. Queda pendiente de aprobación del administrador.');
    render();
  }
});

/* =========================================================
   ARRANQUE
   ========================================================= */
function avisoLogin(msg){
  const el = document.getElementById('login-aviso');
  if(!el) return;
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function mensajeDeLogin(error){
  const m = (error && error.message ? error.message : String(error)).toLowerCase();
  if(m.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
  if(m.includes('email not confirmed'))       return 'La cuenta todavía no está confirmada.';
  if(m.includes('failed to fetch'))           return 'Sin conexión. Revisá tu internet.';
  return (error && error.message) ? error.message : 'No se pudo entrar.';
}

/* navigator.clipboard falla sin https y en algunos navegadores de celular.
   Si no se puede copiar solo, se muestra el texto para copiarlo a mano: es
   preferible a un boton que no hace nada. */
async function copiarAlPortapapeles(texto, mensajeOk){
  try{
    await navigator.clipboard.writeText(texto);
    toast(mensajeOk);
  }catch(e){
    STATE.modal = {type:'texto-copiar', texto};
    render();
  }
}

/* -------- formulario de accesos (administrador) -------- */
document.addEventListener('submit', async function(e){
  if(e.target.id !== 'form-acceso') return;
  e.preventDefault();
  const rol = document.getElementById('acc-rol').value;
  const correo = document.getElementById('acc-correo').value.trim().toLowerCase();
  const nombre = document.getElementById('acc-nombre').value;
  const socioId = Number(document.getElementById('acc-socio').value);

  const yaEsta = accesoPorCorreo(correo);
  if(yaEsta && yaEsta.tienePerfil){
    toast('Ese correo ya tiene cuenta y entra. Si querés cambiarle el socio, quitalo primero.');
    return;
  }
  if(rol === 'socio' && ACCESOS.some(a => a.socioId === socioId && a.correo.toLowerCase() !== correo)){
    toast('Ese socio ya tiene un acceso asignado. Cada socio lleva una sola cuenta.');
    return;
  }
  await guardarAcceso({correo, nombre, rol, socioId});
});

/* -------- registro: el socio elige su contraseña -------- */
document.addEventListener('submit', async function(e){
  if(e.target.id !== 'form-registro') return;
  e.preventDefault();
  avisoLogin('');
  const correo = document.getElementById('correo').value.trim().toLowerCase();
  const codigo = document.getElementById('codigo').value.trim().toUpperCase();
  const clave  = document.getElementById('clave').value;
  const clave2 = document.getElementById('clave2').value;

  if(clave !== clave2){ avisoLogin('Las dos contraseñas no son iguales.'); return; }
  if(clave.length < 8){ avisoLogin('La contraseña necesita al menos 8 caracteres.'); return; }

  const btn = document.getElementById('btn-registrar');
  btn.disabled = true; btn.textContent = 'Creando...';

  // El codigo viaja como metadato. Quien lo comprueba es Postgres.
  const { data, error } = await sb.auth.signUp({
    email: correo, password: clave, options: { data: { codigo } }
  });
  btn.disabled = false; btn.textContent = 'Crear mi contraseña';

  if(error){ avisoLogin(mensajeDeRegistro(error)); return; }

  if(!data.session){
    // Supabase quedo pidiendo confirmacion por correo.
    avisoLogin('Cuenta creada. Revisá tu correo para confirmarla y después entrá.');
    STATE.pantallaEntrada = 'login';
    render();
    return;
  }
  await entrar(data.session);
});

function mensajeDeRegistro(error){
  const m = (error && error.message ? error.message : String(error)).toLowerCase();
  if(m.includes('already registered') || m.includes('already been registered'))
    return 'Ese correo ya tiene una cuenta. Entrá con tu contraseña, o pedile al administrador que te vincule.';
  if(m.includes('password')) return 'La contraseña es muy corta o muy simple. Probá con una más larga.';
  if(m.includes('failed to fetch')) return 'Sin conexión. Revisá tu internet.';
  if(m.includes('rate limit') || m.includes('too many'))
    return 'Demasiados intentos seguidos. Esperá unos minutos y volvé a probar.';
  return (error && error.message) ? error.message : 'No se pudo crear la cuenta.';
}

/* El formulario se dibuja y se borra en cada render, asi que el envio se
   escucha en el documento en vez de en el formulario. */
document.addEventListener('submit', async function(e){
  if(e.target.id !== 'form-login') return;
  e.preventDefault();
  avisoLogin('');
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Entrando...';

  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('correo').value.trim(),
    password: document.getElementById('clave').value
  });
  btn.disabled = false; btn.textContent = 'Entrar';
  if(error){ avisoLogin(mensajeDeLogin(error)); return; }
  await entrar(data.session);
});

/* Traduce el perfil de la base al estado que ya usaban las pantallas. */
async function entrar(sesion){
  STATE.sesion = sesion;
  const { data: perfil, error } = await sb
    .from('perfiles').select('rol, socio_id').eq('id', sesion.user.id).maybeSingle();

  if(error){ avisoLogin(mensajeDeErrorSb(error)); return; }
  if(!perfil){
    await sb.auth.signOut();
    STATE.sesion = null;
    render();
    avisoLogin('Tu cuenta existe pero todavía no ve nada. Suele ser que el código de registro no coincidió. Pedile al administrador que te vincule o que te dé un código nuevo.');
    return;
  }

  try{
    await cargarTodo();
  }catch(e){
    avisoLogin(mensajeDeErrorSb(e));
    return;
  }

  STATE.role = perfil.rol === 'administrador' ? 'admin' : 'socio';
  if(STATE.role === 'admin'){
    await cargarAccesos();
    await cargarBitacora();
  }else{
    // Un socio no tiene por qué llevar encima lo que vio el administrador.
    ACCESOS.length = 0;
    BITACORA.length = 0;
  }
  const socio = SEED.socios.find(x => x.id === perfil.socio_id);
  STATE.socioActivo = socio ? socio.nombre : null;

  // Un administrador que ademas es socio entra como administrador: el rol
  // mas amplio manda, y desde ahi ve tambien su propia cartera.
  STATE.screen = STATE.role === 'admin' ? 'tablero' : 'cartera';
  STATE.screenParams = {};
  CONFIG.saldoInicialEfectivo = CONFIG.saldoInicialEfectivo || calcularSaldoInicialEfectivoSugerido();
  render();
}

(async function arrancar(){
  if(!iniciarSupabase()){
    document.getElementById('app').innerHTML =
      '<div style="padding:40px;text-align:center;font-family:sans-serif;">' +
      'Falta configurar la conexión con Supabase en <code>config.js</code>.</div>';
    return;
  }
  // El enlace que recibe el socio trae ?registro: cae directo en la pantalla
  // de crear contraseña, sin tener que buscarla.
  if(location.search.includes('registro')) STATE.pantallaEntrada = 'registro';
  render();   // pinta el login mientras se revisa si hay sesion guardada
  const { data } = await sb.auth.getSession();
  if(data.session) await entrar(data.session);
})();
</script>
